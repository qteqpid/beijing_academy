<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北中观察站</title>
  <link rel="icon" href="bjzx-favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="bjzx-favicon.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root{
      --red:#b50018;
      --red-2:#e1192d;
      --ink:#151515;
      --muted:#666;
      --line:#e7e7e7;
      --paper:#fff;
      --soft:#f7f7f7;
      --cream:#fbfaf7;
      --shadow:0 24px 70px rgba(18,24,40,.10);
      --shadow-strong:0 34px 90px rgba(18,24,40,.16);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:"Microsoft Yahei","PingFang SC",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 12% 18%,rgba(181,0,24,.06),transparent 26%),
        radial-gradient(circle at 86% 36%,rgba(16,120,140,.055),transparent 28%),
        var(--paper);
    }
    a{color:inherit;text-decoration:none}
    .scroll-progress{
      position:fixed;
      left:0;
      top:0;
      width:0;
      height:4px;
      background:linear-gradient(90deg,var(--red),#ff3154);
      z-index:100;
      box-shadow:0 0 24px rgba(225,25,45,.45);
      pointer-events:none;
    }
    .top-rule{
      height:5px;
      background:linear-gradient(90deg,#8b0011,var(--red),#ff394f);
      overflow:hidden;
      position:relative;
    }
    .top-rule::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(110deg,transparent 0 34%,rgba(255,255,255,.22) 48%,transparent 62%);
      transform:translateX(-70%);
      animation:topSheen 7s ease-in-out infinite;
    }
    .site-header{
      background:rgba(255,255,255,.96);
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:1000;
      backdrop-filter:blur(18px);
      transition:box-shadow .28s ease;
    }
    body.is-scrolled .site-header{box-shadow:0 18px 46px rgba(16,24,40,.12)}
    .header-inner{
      width:min(1180px,calc(100% - 48px));
      min-height:86px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:40px;
    }
    .logo img{width:180px;height:auto;display:block;transition:transform .24s ease}
    .logo:hover img{transform:translateY(-2px)}
    .nav{
      display:flex;
      gap:32px;
      color:#344054;
      font-size:16px;
      font-weight:800;
      white-space:nowrap;
    }
    .nav a{
      padding:31px 0;
      position:relative;
    }
    .nav a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:24px;
      width:0;
      height:2px;
      background:var(--red);
      transition:width .24s ease;
    }
    .nav a:hover::after,
    .nav a.active::after{width:100%}
    .page-hero{
      min-height:420px;
      color:#fff;
      background:
        linear-gradient(180deg,rgba(0,0,0,.22),rgba(0,0,0,.72)),
        var(--hero-image, url("bjzx-hero-2.jpg")) center/cover no-repeat;
      display:flex;
      align-items:flex-end;
      position:relative;
      overflow:hidden;
      isolation:isolate;
    }
    .page-hero::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg,rgba(255,255,255,.11) 1px,transparent 1px),
        linear-gradient(0deg,rgba(255,255,255,.11) 1px,transparent 1px);
      background-size:42px 42px;
      opacity:.28;
      z-index:-1;
    }
    .page-hero-inner{
      width:min(1180px,calc(100% - 48px));
      margin:0 auto;
      padding:74px 0 66px;
    }
    .breadcrumb{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      font-size:14px;
      color:rgba(255,255,255,.82);
      margin-bottom:24px;
      font-weight:700;
    }
    .breadcrumb a{color:#fff;border-bottom:1px solid rgba(255,255,255,.64)}
    .kicker{
      display:inline-flex;
      padding:7px 13px;
      border:1px solid rgba(255,255,255,.34);
      background:rgba(255,255,255,.12);
      font-size:13px;
      font-weight:900;
      letter-spacing:.16em;
      text-transform:uppercase;
      margin-bottom:20px;
      backdrop-filter:blur(14px);
    }
    h1{
      max-width:880px;
      font-size:58px;
      line-height:1.1;
      font-weight:900;
      letter-spacing:0;
      text-shadow:0 18px 48px rgba(0,0,0,.32);
    }
    .summary{
      max-width:760px;
      margin-top:22px;
      color:rgba(255,255,255,.88);
      font-size:20px;
      line-height:1.8;
    }
    .content-shell{
      width:min(1180px,calc(100% - 48px));
      margin:64px auto 96px;
      display:grid;
      grid-template-columns:minmax(0,1fr) 300px;
      gap:64px;
      align-items:start;
    }
    .panel{
      background:#fff;
      border:1px solid var(--line);
      box-shadow:0 18px 54px rgba(18,24,40,.065);
      padding:36px;
    }
    .section-title{
      font-size:34px;
      line-height:1.2;
      padding-left:18px;
      border-left:6px solid var(--red);
      margin-bottom:24px;
    }
    .lead{
      color:#424242;
      font-size:18px;
      line-height:2;
      margin-bottom:26px;
    }
    .rich-section{
      margin:34px 0;
      padding-top:28px;
      border-top:1px solid var(--line);
    }
    .rich-section h3{
      font-size:26px;
      line-height:1.3;
      margin-bottom:14px;
    }
    .rich-section p{
      color:#444;
      font-size:17px;
      line-height:1.95;
      margin:12px 0;
    }
    .detail-list{
      display:grid;
      gap:12px;
      margin:18px 0 6px;
    }
    .detail-list li{
      list-style:none;
      color:#444;
      line-height:1.75;
      padding:14px 16px 14px 44px;
      background:var(--soft);
      border-left:4px solid var(--red);
      position:relative;
    }
    .detail-list li::before{
      content:"";
      width:8px;
      height:8px;
      background:var(--red);
      position:absolute;
      left:18px;
      top:24px;
    }
    .info-table{
      display:grid;
      grid-template-columns:180px 1fr;
      border:1px solid var(--line);
      margin:24px 0;
      background:#fff;
    }
    .info-table div{
      padding:16px 18px;
      border-bottom:1px solid var(--line);
      line-height:1.7;
    }
    .info-table div:nth-child(odd){
      background:var(--cream);
      color:var(--red);
      font-weight:900;
    }
    .info-table div:nth-last-child(-n+2){border-bottom:0}
    .forum-board{
      display:grid;
      gap:16px;
      margin:24px 0;
    }
    .forum-post{
      border:1px solid var(--line);
      background:#fff;
      padding:22px;
      box-shadow:0 12px 34px rgba(18,24,40,.055);
    }
    .forum-post strong{
      display:block;
      font-size:19px;
      line-height:1.45;
      margin-bottom:8px;
    }
    .forum-post span{
      color:var(--red);
      font-size:12px;
      font-weight:900;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .forum-post p{
      color:#555;
      line-height:1.75;
      margin-top:8px;
    }
    .quote-card{
      margin:30px 0;
      padding:28px 32px;
      background:linear-gradient(180deg,#fff,var(--cream));
      border-left:8px solid var(--red);
      font-size:22px;
      line-height:1.7;
      font-weight:900;
      box-shadow:var(--shadow);
    }
    .tag-row{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin:18px 0 8px;
    }
    .tag-row span{
      border:1px solid rgba(181,0,24,.22);
      background:#fffafa;
      color:var(--red);
      padding:8px 11px;
      font-size:13px;
      font-weight:900;
    }
    .action-box{
      margin:26px 0;
      padding:24px;
      background:#151515;
      color:#fff;
      border-top:6px solid var(--red);
    }
    .action-box h3{font-size:24px;margin-bottom:10px}
    .action-box p{color:rgba(255,255,255,.78);line-height:1.8}
    .source-note{
      margin-top:34px;
      padding:24px;
      border:1px solid rgba(181,0,24,.22);
      background:#fffafa;
    }
    .source-note h3{
      color:var(--red);
      font-size:22px;
      margin-bottom:12px;
    }
    .source-note p{
      color:#444;
      line-height:1.85;
      margin:10px 0;
    }
    .source-note ul{
      display:grid;
      gap:8px;
      margin-top:12px;
      list-style:none;
    }
    .source-note a{
      color:var(--red);
      font-weight:900;
      border-bottom:1px solid rgba(181,0,24,.4);
    }
    .forum-shell{
      display:grid;
      gap:18px;
    }
    .forum-login-card{
      display:grid;
      gap:14px;
      grid-template-columns:1fr;
      border:1px solid var(--line);
      background:#151515;
      color:#fff;
      padding:22px;
      box-shadow:var(--shadow);
    }
    .forum-login-card h3{
      font-size:22px;
      line-height:1.35;
    }
    .forum-login-card p{
      color:rgba(255,255,255,.72);
      line-height:1.7;
    }
    .forum-login-form{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr)) auto;
      gap:10px;
      align-items:end;
    }
    .forum-login-form label{
      display:grid;
      gap:6px;
      font-weight:900;
      font-size:13px;
      color:rgba(255,255,255,.8);
    }
    .forum-login-form input{
      width:100%;
      border:1px solid rgba(255,255,255,.22);
      background:rgba(255,255,255,.08);
      color:#fff;
      font:inherit;
      padding:12px 13px;
      outline:none;
    }
    .forum-login-form input:focus{
      border-color:rgba(255,255,255,.62);
      box-shadow:0 0 0 4px rgba(255,255,255,.1);
    }
    .forum-userbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
      border:1px solid rgba(181,0,24,.18);
      background:#fff7f8;
      padding:14px 16px;
      font-weight:900;
    }
    .forum-userbar span{
      color:var(--muted);
      font-weight:700;
      margin-left:8px;
    }
    .forum-category-tabs{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      border:1px solid var(--line);
      background:#fff;
      padding:12px;
      box-shadow:0 10px 26px rgba(18,24,40,.045);
    }
    .forum-category-tabs button{
      border:1px solid rgba(181,0,24,.2);
      background:#fff;
      color:#8b0011;
      font-weight:900;
      padding:9px 12px;
      cursor:pointer;
      transition:background .2s ease,transform .2s ease,border-color .2s ease;
    }
    .forum-category-tabs button:hover,
    .forum-category-tabs button.active{
      background:var(--red);
      color:#fff;
      border-color:var(--red);
      transform:translateY(-2px);
    }
    .forum-composer{
      background:linear-gradient(180deg,#fff,var(--cream));
      border:1px solid var(--line);
      border-top:6px solid var(--red);
      padding:26px;
      box-shadow:var(--shadow);
    }
    .forum-composer.is-disabled{
      opacity:.68;
    }
    .forum-composer label{
      display:block;
      color:#333;
      font-weight:900;
      margin:16px 0 8px;
    }
    .forum-composer input,
    .forum-composer select,
    .forum-composer textarea,
    .reply-box input,
    .reply-box textarea{
      width:100%;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      font:inherit;
      padding:13px 14px;
      outline:none;
      transition:border-color .2s ease,box-shadow .2s ease;
    }
    .forum-composer textarea,
    .reply-box textarea{
      min-height:116px;
      resize:vertical;
    }
    .forum-composer input:focus,
    .forum-composer select:focus,
    .forum-composer textarea:focus,
    .reply-box input:focus,
    .reply-box textarea:focus{
      border-color:rgba(181,0,24,.48);
      box-shadow:0 0 0 4px rgba(181,0,24,.08);
    }
    .forum-toolbar{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      margin-top:14px;
    }
    .sticker-toggle{
      margin-top:14px;
    }
    .sticker-panel{
      display:none;
      margin-top:12px;
      padding:14px;
      border:1px solid var(--line);
      background:#fff;
    }
    .sticker-panel.open{
      display:block;
    }
    .sticker-search{
      margin-top:0;
    }
    .sticker-search input{
      width:100%;
      border:1px solid var(--line);
      background:#fff;
      color:var(--ink);
      font:inherit;
      padding:12px 14px;
      outline:none;
      transition:border-color .2s ease,box-shadow .2s ease;
    }
    .sticker-search input:focus{
      border-color:rgba(181,0,24,.48);
      box-shadow:0 0 0 4px rgba(181,0,24,.08);
    }
    .sticker-presets{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }
    .sticker-web-search{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }
    .sticker-web-search a{
      border:1px solid rgba(21,21,21,.14);
      background:#151515;
      color:#fff;
      font-weight:900;
      padding:8px 11px;
      font-size:13px;
      transition:transform .2s ease,background .2s ease;
    }
    .sticker-web-search a:hover{
      background:var(--red);
      transform:translateY(-2px);
    }
    .sticker-chip{
      border:1px solid rgba(181,0,24,.22);
      background:#fff7f7;
      color:var(--red);
      font-weight:800;
      padding:7px 11px;
      cursor:pointer;
      transition:background .2s ease,transform .2s ease;
    }
    .sticker-chip:hover{
      background:#fff;
      transform:translateY(-2px);
    }
    .forum-btn{
      border:0;
      background:var(--red);
      color:#fff;
      font-weight:900;
      padding:11px 15px;
      cursor:pointer;
      transition:transform .2s ease,background .2s ease;
    }
    .forum-btn:hover{background:#d90722;transform:translateY(-2px)}
    .forum-btn.secondary{background:#222}
    .forum-btn.light{
      background:#fff;
      color:var(--red);
      border:1px solid rgba(181,0,24,.28);
    }
    .forum-btn.light.is-active{
      background:#fff1f2;
      border-color:rgba(181,0,24,.48);
      color:#8b0011;
      box-shadow:inset 0 0 0 1px rgba(181,0,24,.14);
    }
    .forum-btn:disabled{
      cursor:not-allowed;
      opacity:.54;
      transform:none;
    }
    .sticker-picker{
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(82px,1fr));
      gap:10px;
      margin-top:14px;
    }
    .sticker-empty{
      color:var(--muted);
      padding:14px;
      border:1px dashed #bbb;
      background:#fff;
      line-height:1.7;
    }
    .sticker-btn{
      min-height:72px;
      border:1px solid var(--line);
      background:#fff;
      cursor:pointer;
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
      transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
    }
    .sticker-btn:hover{
      transform:translateY(-3px) rotate(-2deg);
      box-shadow:var(--shadow);
      border-color:rgba(181,0,24,.32);
    }
    .sticker-btn img{
      width:100%;
      height:64px;
      object-fit:cover;
    }
    .sticker-btn.photo{
      min-height:96px;
    }
    .sticker-btn.card{
      min-height:96px;
    }
    .sticker-btn.photo img{
      height:96px;
    }
    .sticker-btn.card img{
      height:96px;
      object-fit:cover;
    }
    .sticker-btn span{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      padding:6px 8px;
      color:#fff;
      background:linear-gradient(180deg,transparent,rgba(0,0,0,.82));
      font-size:12px;
      font-weight:900;
      text-shadow:0 1px 5px rgba(0,0,0,.6);
    }
    .sticker-btn.vibe img{
      height:70px;
      object-fit:cover;
    }
    .sticker-btn.emoji img,
    .inline-sticker{
      width:28px;
      height:28px;
      object-fit:contain;
      vertical-align:middle;
    }
    .inline-meme,
    .inline-vibe,
    .inline-photo-sticker{
      display:block;
      max-width:min(220px,100%);
      max-height:150px;
      object-fit:contain;
      margin:10px 0;
      border:1px solid var(--line);
      background:#fff;
      box-shadow:0 10px 28px rgba(18,24,40,.10);
    }
    .inline-photo-sticker{
      max-width:min(260px,100%);
      max-height:none;
      overflow:hidden;
      position:relative;
      padding:0;
    }
    .inline-photo-sticker img{
      width:100%;
      height:170px;
      object-fit:cover;
      display:block;
    }
    .inline-photo-sticker figcaption{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      padding:10px 12px;
      background:linear-gradient(180deg,transparent,rgba(0,0,0,.86));
      color:#fff;
      font-size:20px;
      font-weight:900;
      text-align:center;
      text-shadow:0 2px 8px rgba(0,0,0,.75);
    }
    .forum-status{
      color:var(--red);
      font-weight:900;
      min-height:22px;
      margin-top:12px;
    }
    .forum-feed{
      display:grid;
      gap:12px;
    }
    .student-post{
      border:1px solid var(--line);
      background:#fff;
      box-shadow:0 10px 26px rgba(18,24,40,.055);
      padding:18px;
    }
    .post-author-row{
      display:flex;
      gap:12px;
      align-items:flex-start;
    }
    .forum-avatar{
      width:44px;
      height:44px;
      flex:0 0 44px;
      display:grid;
      place-items:center;
      overflow:hidden;
      border:2px solid #fff;
      background:linear-gradient(135deg,#b50018,#151515);
      color:#fff;
      font-size:18px;
      font-weight:900;
      box-shadow:0 8px 22px rgba(18,24,40,.14);
    }
    .forum-avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    .student-post header{
      display:flex;
      justify-content:space-between;
      gap:12px;
      align-items:flex-start;
      margin-bottom:10px;
    }
    .student-post h3{
      font-size:21px;
      line-height:1.35;
      margin-bottom:5px;
    }
    .post-meta{
      color:var(--muted);
      font-size:13px;
      line-height:1.6;
    }
    .post-category{
      display:inline-flex;
      align-items:center;
      padding:4px 8px;
      margin-right:6px;
      color:#fff;
      background:#151515;
      font-size:12px;
      font-weight:900;
    }
    .post-body{
      color:#444;
      line-height:1.75;
      white-space:pre-wrap;
      margin:10px 0;
    }
    .post-actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      border-top:1px solid var(--line);
      padding-top:10px;
      margin-top:10px;
    }
    .reply-box{
      margin-top:12px;
      padding:14px;
      background:var(--soft);
      border:1px solid var(--line);
    }
    .reply-list{
      display:grid;
      gap:8px;
      margin-top:10px;
    }
    .reply{
      background:#fffafa;
      border-left:4px solid var(--red);
      padding:10px 12px;
      color:#444;
      line-height:1.7;
    }
    .reply-author-row{
      display:flex;
      gap:10px;
      align-items:flex-start;
    }
    .reply .forum-avatar{
      width:34px;
      height:34px;
      flex-basis:34px;
      font-size:14px;
      box-shadow:none;
      border-width:1px;
    }
    .back-to-top{
      position:fixed;
      right:22px;
      bottom:24px;
      z-index:20;
      width:48px;
      height:48px;
      border:0;
      background:var(--red);
      color:#fff;
      font-size:20px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 14px 36px rgba(181,0,24,.28);
      opacity:0;
      pointer-events:none;
      transform:translateY(12px);
      transition:opacity .2s ease,transform .2s ease,background .2s ease;
    }
    .back-to-top.show{
      opacity:1;
      pointer-events:auto;
      transform:translateY(0);
    }
    .back-to-top:hover{
      background:#d90722;
    }
    .empty-forum{
      padding:24px;
      background:var(--soft);
      border:1px dashed #bbb;
      color:var(--muted);
      line-height:1.8;
    }
    .admin-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:16px;
      margin:24px 0;
    }

            <article><strong>问</strong><div><h3>提出问题</h3><p>从课堂困难、项目卡点和学生反馈中发现研究主题。例如：为什么有些小组展示很清楚，有些小组明明做了很多却讲不明白？</p></div></article>

            <article><strong>改</strong><div><h3>改进设计</h3><p>优化任务说明、资源支持、评价方式和学习节奏。好的教学研究最后应该能反过来帮助下一次学习更顺利。</p></div></article>

            <p>教学研究不一定只是老师写论文。学生也可以通过观察笔记、学习复盘、访谈记录和项目日志参与其中。北中观察站可以开设“学习方法征集”“课堂观察手记”“项目复盘墙”等栏目。</p>

            </ul>

    async function initOfficialNews(){
      if (pageKey !== "news") return;
      const status = document.getElementById("official-news-status");
      const list = document.getElementById("official-news-list");
      if (!status || !list) return;
      if (location.protocol === "file:") {
        status.textContent = "当前是直接打开 HTML 文件，浏览器不允许稳定跨域抓取官网。运行 server.js 后用 http://localhost:8787 打开，就会自动同步官网最新动态。";
        return;
      }
      try {
        status.textContent = "正在从北京中学官网读取最新动态...";
        const response = await fetch("/api/news/official?limit=8");
        if (!response.ok) throw new Error("official news request failed");
        const data = await response.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if (!items.length) {
          status.textContent = "暂时没有读取到官网动态。";
          return;
        }
        status.textContent = `已同步官网最新动态 ${items.length} 条，更新时间：${escapeHtml(data.fetchedAt || "")}`;
        list.innerHTML = items.map(item => `
          <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">
            <time>${escapeHtml(item.date || "官网")}</time>
            <span>${escapeHtml(item.title)}</span>
          </a>
        `).join("");
      } catch (error) {
        console.error(error);
        status.textContent = "官网动态同步失败：请确认本地服务器正在运行，或稍后再试。";
      }
    }

    function expandSensitiveWords(words){
      const separators = [" ",".","-","_","*","·"];
      const expanded = new Set(words);
      words.forEach(word => {
        const chars = Array.from(word);
        separators.forEach(separator => {
          if (chars.length > 1) expanded.add(chars.join(separator));
        });
      });
      Object.entries(forumModerationParts).forEach(([key, values]) => {
        if (!key.endsWith("Heads")) return;
        const tails = forumModerationParts[key.replace("Heads","Tails")] || [];
        values.forEach(head => {
          tails.forEach(tail => {
            expanded.add(`${head}${tail}`);
            expanded.add(`${head} ${tail}`);
            expanded.add(`${head}.${tail}`);
            expanded.add(`${head}-${tail}`);
          });
        });
      });
      return Array.from(expanded);

    async function hashForumPassword(value){
      const text = String(value || "");
      if (window.crypto && window.crypto.subtle && window.TextEncoder) {
        const bytes = new TextEncoder().encode(text);
        const hashBuffer = await window.crypto.subtle.digest("SHA-256", bytes);
        return Array.from(new Uint8Array(hashBuffer)).map(byte => byte.toString(16).padStart(2, "0")).join("");
      }
      let hash = 2166136261;
      for (let index = 0; index < text.length; index += 1) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return `fallback-${(hash >>> 0).toString(16)}`;
    }

          ? `<figure class="inline-photo-sticker"><img src="${sticker.url}" alt="${sticker.name}"><figcaption>${escapeHtml(sticker.caption || sticker.name)}</figcaption></figure>`
          : `<img class="${className}" src="${sticker.url}" alt="${sticker.name}">`;
        safe = safe.split(sticker.code).join(stickerHtml);
      });
      return safe.replace(/\n/g,"<br>");
    }

    function normalizeForModeration(value){
      return String(value)
        .toLowerCase()
        .replace(/[\\s\\u200b\\u200c\\u200d\\ufe0f_\\-—=+*/\\\\|,.!?，。！？、:：;；"'“”‘’()[\\]{}<>《》【】~·`^#$%@]+/g,"")
        .replace(/0/g,"o")
        .replace(/1/g,"i")
        .replace(/3/g,"e")
        .replace(/4/g,"死")
        .replace(/5/g,"我");
    }

    function findSensitiveWord(...values){
      const original = values.join(" ");
      const normalized = normalizeForModeration(original);
      const wordHit = forumExpandedSensitiveWords.find(word => normalized.includes(normalizeForModeration(word)));
      if (wordHit) return wordHit;
      const patternHit = forumSensitivePatterns.find(item => item.pattern.test(original) || item.pattern.test(normalized));
      return patternHit ? patternHit.label : "";
    }

    function normalizeForumPosts(value){
      const list = Array.isArray(value) ? value : Array.isArray(value && value.posts) ? value.posts : [];
      return list.map(post => {
        const reportedBy = Array.isArray(post.reportedBy)
          ? post.reportedBy
          : Array.from({length:Number(post.reports) || 0}, (_, index) => `legacy-${post.id}-${index}`);
        const legacyLikeCount = Number(post.likes) || 0;
        const likedBy = Array.isArray(post.likedBy) && post.likedBy.length
          ? post.likedBy
          : Array.from({length:legacyLikeCount}, (_, index) => `legacy-like-${post.id}-${index}`);
        const favoritedBy = Array.isArray(post.favoritedBy) ? post.favoritedBy : [];
        return {
          ...post,
          category:post.category || "campus",
          likedBy,
          likes:likedBy.length,
          favoritedBy,
          favorites:favoritedBy.length,
          ownerId:post.ownerId || "",
          authorAvatar:post.authorAvatar || "",
          reportedBy,
          reports:reportedBy.length,
          replies:Array.isArray(post.replies)
            ? post.replies.map((reply, index) => ({id:reply.id || `reply-${post.id}-${index}`, ownerId:reply.ownerId || "", avatarUrl:reply.avatarUrl || "", ...reply}))
            : []
        };
      });
    }

    const forumApi = {
      endpoint(name, id = ""){
        return `${forumServerConfig.baseUrl}${forumServerConfig.endpoints[name].replace(":id", encodeURIComponent(id))}`;
      },
      async request(name, options = {}, id = ""){
        if (!forumServerConfig.useServer) return null;
        const isFormData = typeof FormData !== "undefined" && options.body instanceof FormData;
        const {headers:customHeaders = {}, ...requestOptions} = options;
        const response = await fetch(this.endpoint(name, id), {
          ...requestOptions,
          headers:isFormData ? customHeaders : {"Content-Type":"application/json", ...customHeaders}
        });
        if (!response.ok) throw new Error(`Forum API ${name} failed`);
        if (response.status === 204) return null;
        return response.json();
      },
      async listPosts(){
        if (forumServerConfig.useServer) {
          try {
            const serverPosts = normalizeForumPosts(await this.request("list"));
            return serverPosts.length ? serverPosts : normalizeForumPosts(defaultForumPosts);
          } catch (error) {
            console.error(error);
          }
        }
        try {
          const saved = JSON.parse(localStorage.getItem(forumStorageKey));
          const localPosts = Array.isArray(saved) ? normalizeForumPosts(saved) : [];
          return localPosts.length ? localPosts : normalizeForumPosts(defaultForumPosts);
        } catch {
          return normalizeForumPosts(defaultForumPosts);
        }
      },
      async savePosts(posts){
        const normalized = normalizeForumPosts(posts);
        if (forumServerConfig.useServer) {
          await this.request("list", {method:"PUT", body:JSON.stringify(normalized)});
        } else {
          localStorage.setItem(forumStorageKey, JSON.stringify(normalized));
        }
        return normalized;
      },
      async createPost(post, posts){
        if (forumServerConfig.useServer) {
          return normalizeForumPosts(await this.request("create", {method:"POST", body:JSON.stringify({...post, userId:getForumUserId()})}));
        }
        return this.savePosts([post, ...posts]);
      },
      async login(credentials){
        if (forumServerConfig.useServer) {
          return this.request("login", {method:"POST", body:JSON.stringify(credentials)});
        }
        const username = normalizeForumUsername(credentials.username);
        const displayName = String(credentials.displayName || credentials.username || "论坛用户").trim().slice(0, 24);
        const password = String(credentials.password || "");
        if (!username || password.length < 3) {
          throw new Error("invalid_login");
        }
        const passwordHash = await hashForumPassword(password);
        const users = readForumLocalUsers();
        let user = users.find(item => item.username === username);
        if (user && user.passwordHash !== passwordHash) {
          throw new Error("wrong_password");
        }
        if (!user) {
          user = {id:`user-${username}`, username, displayName, passwordHash, avatarUrl:"", createdAt:nowLabel()};
          users.push(user);
        } else if (displayName && user.displayName !== displayName) {
          user.displayName = displayName;
        }
        saveForumLocalUsers(users);
        return {user:{id:user.id, username:user.username, displayName:user.displayName, avatarUrl:user.avatarUrl || ""}};
      },
      async likePost(postId, posts){
        if (forumServerConfig.useServer) {
          return normalizeForumPosts(await this.request("like", {method:"POST", body:JSON.stringify({userId:getForumUserId()})}, postId));
        }
        const userId = getForumUserId();
        return this.savePosts(posts.map(post => {
          if (post.id !== postId) return post;
          const likedBy = post.likedBy.includes(userId)
            ? post.likedBy.filter(id => id !== userId)
            : [...post.likedBy, userId];
          return {...post, likedBy, likes:likedBy.length};
        }));
      },
      async favoritePost(postId, posts){
        if (forumServerConfig.useServer) {
          return normalizeForumPosts(await this.request("favorite", {method:"POST", body:JSON.stringify({userId:getForumUserId()})}, postId));
        }
        const userId = getForumUserId();
        return this.savePosts(posts.map(post => {
          if (post.id !== postId) return post;
          const favoritedBy = post.favoritedBy.includes(userId)
            ? post.favoritedBy.filter(id => id !== userId)
            : [...post.favoritedBy, userId];
          return {...post, favoritedBy, favorites:favoritedBy.length};
        }));
      },
      async reportPost(postId, posts){
        if (forumServerConfig.useServer) {
          return normalizeForumPosts(await this.request("report", {method:"POST", body:JSON.stringify({userId:getForumUserId()})}, postId));
        }
        return this.savePosts(posts);
      },
      async addReply(postId, reply, posts){
        if (forumServerConfig.useServer) {
          return normalizeForumPosts(await this.request("reply", {method:"POST", body:JSON.stringify({...reply, userId:getForumUserId()})}, postId));
        }
        return this.savePosts(posts.map(post => post.id === postId ? {...post, replies:[...post.replies, reply]} : post));
      },
      async deleteReply(postId, replyId, posts, adminToken = ""){
        if (forumServerConfig.useServer) {
          const endpointPath = forumServerConfig.endpoints.deleteReply
            .replace(":id", encodeURIComponent(postId))
            .replace(":replyId", encodeURIComponent(replyId));
          const response = await fetch(`${forumServerConfig.baseUrl}${endpointPath}`, {
            method:"DELETE",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({userId:getForumUserId(), adminToken})
          });
          if (!response.ok) throw new Error("Forum API deleteReply failed");
          return normalizeForumPosts(await response.json());
        }
        return this.savePosts(posts.map(post => post.id === postId ? {...post, replies:post.replies.filter(reply => reply.id !== replyId)} : post));
      },
      async deletePost(postId, posts, adminToken = "local-demo-admin-token"){
        if (forumServerConfig.useServer) {
          return normalizeForumPosts(await this.request("delete", {method:"DELETE", body:JSON.stringify({userId:getForumUserId(), adminToken})}, postId));
        }
        return this.savePosts(posts.filter(post => post.id !== postId));
      },
      async deleteOwnPost(postId, posts){
        if (forumServerConfig.useServer) {
          return normalizeForumPosts(await this.request("delete", {method:"DELETE", body:JSON.stringify({userId:getForumUserId()})}, postId));
        }
        return this.savePosts(posts.filter(post => post.id !== postId));
      },
      async clearPostReports(postId, posts){
        if (forumServerConfig.useServer) {
          return normalizeForumPosts(await this.request("clearReports", {method:"DELETE"}, postId));
        }
        return this.savePosts(posts.map(post => post.id === postId ? {...post, reportedBy:[], reports:0} : post));
      },
      async clearAllReports(posts){
        if (forumServerConfig.useServer) {
          return normalizeForumPosts(await this.request("resetReports", {method:"DELETE"}));
        }
        return this.savePosts(posts.map(post => ({...post, reportedBy:[], reports:0})));
      },
      async restoreDemo(){
        if (forumServerConfig.useServer) {
          return normalizeForumPosts(await this.request("restoreDemo", {method:"POST", body:JSON.stringify(defaultForumPosts)}));
        }
        return this.savePosts(defaultForumPosts);
      },
      async getProfile(userId, posts){
        if (forumServerConfig.useServer) {
          try {
            return this.request("profile", {}, userId);
          } catch (error) {
            console.error(error);
          }
        }
        const session = getForumSession();
        const ownedPosts = posts.filter(post => post.ownerId === userId);
        const favorites = posts.filter(post => post.favoritedBy.includes(userId));
        const receivedLikes = ownedPosts.reduce((total, post) => total + post.likedBy.length, 0);
        return {
          user:session ? {id:session.id, username:session.username, displayName:session.displayName} : {id:userId, username:userId, displayName:"游客"},
          stats:{
            posts:ownedPosts.length,
            favorites:favorites.length,
            receivedLikes,
            replies:ownedPosts.reduce((total, post) => total + post.replies.length, 0)
          },
          posts:ownedPosts,
          favorites,
          likedDetails:ownedPosts.map(post => ({
            id:post.id,
            title:post.title,
            likedBy:post.likedBy,
            likes:post.likedBy.length,
            createdAt:post.createdAt
          }))
        };
      },
      async updateProfile(userId, profile, posts = []){
        if (forumServerConfig.useServer) {
          return this.request("updateProfile", {method:"PUT", body:JSON.stringify(profile)}, userId);
        }
        const session = getForumSession();
        if (session && session.id === userId) {
          saveForumSession({...session, ...profile});
        }
        const users = readForumLocalUsers();
        const user = users.find(item => item.id === userId);
        if (user) {
          if (typeof profile.displayName === "string" && profile.displayName.trim()) user.displayName = profile.displayName.trim().slice(0, 24);
          if (typeof profile.avatarUrl === "string") user.avatarUrl = profile.avatarUrl;
          saveForumLocalUsers(users);
        }
        const updatedPosts = normalizeForumPosts(posts).map(post => {
          const nextPost = post.ownerId === userId ? {...post, authorAvatar:profile.avatarUrl || ""} : post;
          return {
            ...nextPost,
            replies:nextPost.replies.map(reply => reply.ownerId === userId ? {...reply, avatarUrl:profile.avatarUrl || ""} : reply)
          };
        });
        await this.savePosts(updatedPosts);
        return {user:{...(session || {id:userId}), ...profile}, posts:updatedPosts};
      },
      async uploadImage(file){
        if (!forumServerConfig.useServer) throw new Error("Image upload API is reserved but not enabled");
        const formData = new FormData();
        formData.append("image", file);
        return this.request("upload", {method:"POST", headers:{}, body:formData});
      },
      async adminLogin(credentials){
        if (forumServerConfig.useServer) {
          return this.request("adminLogin", {method:"POST", body:JSON.stringify(credentials)});
        }
        if (String(credentials.answer || "").trim() !== "猫娘") throw new Error("wrong_admin_answer");
        return {token:"local-demo-admin-token", role:"admin"};
      },
      async listReports(){
        return this.request("reports");
      },
      async updateSensitiveWords(words){
        return this.request("sensitiveWords", {method:"PUT", body:JSON.stringify({words})});
      }
    };

    function nowLabel(){
      const date = new Date();
      const pad = value => String(value).padStart(2,"0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function createForumId(prefix){
      return `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    }

    async function initForum(){
      if (pageKey !== "forum") return;
      const form = document.getElementById("forum-form");
      const feed = document.getElementById("forum-feed");
      const status = document.getElementById("forum-status");
      const stickerPicker = document.getElementById("sticker-picker");
      const stickerSearch = document.getElementById("sticker-search");
      const stickerPresets = document.getElementById("sticker-presets");
      const stickerWebSearch = document.getElementById("sticker-web-search");
      const stickerToggle = document.getElementById("sticker-toggle");
      const stickerPanel = document.getElementById("sticker-panel");
      const uploadButton = document.getElementById("forum-upload");
      const resetButton = document.getElementById("forum-reset-demo");
      const loginCard = document.getElementById("forum-login-card");
      const loginForm = document.getElementById("forum-login-form");
      const loginUsername = document.getElementById("forum-login-username");
      const loginDisplay = document.getElementById("forum-login-display");
      const loginPassword = document.getElementById("forum-login-password");
      const userbar = document.getElementById("forum-userbar");
      const categoryTabs = document.getElementById("forum-category-tabs");
      const categoryInput = document.getElementById("forum-category");
      const titleInput = document.getElementById("forum-title");
      const contentInput = document.getElementById("forum-content");
      let forumSession = getForumSession();
      let forumUserId = getForumUserId();
      let activeCategory = localStorage.getItem(forumCategoryKey) || "all";
      let focusedTextarea = contentInput;
      let posts = await forumApi.listPosts();
      const setStatus = message => {
        status.textContent = message;
        clearTimeout(initForum.statusTimer);
        initForum.statusTimer = setTimeout(()=>{ status.textContent = ""; }, 2600);
      };

      const categoryLabel = id => (forumCategories.find(category => category.id === id) || forumCategories[0]).label;

      function renderLogin(){
        const loggedIn = Boolean(forumSession && forumSession.id);
        loginCard.style.display = loggedIn ? "none" : "grid";
        userbar.innerHTML = loggedIn
          ? `<div class="post-author-row">${renderAvatar(forumSession.displayName || forumSession.username, forumSession.avatarUrl || "")}<div>已登录：${escapeHtml(forumSession.displayName || forumSession.username)}<span>@${escapeHtml(forumSession.username || forumSession.id)}</span></div></div><button class="forum-btn light" type="button" id="forum-logout">退出登录</button>`
          : `<div>游客浏览模式<span>登录后可发帖、回复、点赞、收藏和投诉</span></div>`;
        form.classList.toggle("is-disabled", !loggedIn);
        form.querySelectorAll("input,select,textarea,button").forEach(element => {
          if (element.id === "forum-reset-demo" || element.closest(".sticker-panel")) return;
          element.disabled = !loggedIn;
        });
        stickerToggle.disabled = !loggedIn;
      }

      function renderCategoryTabs(){
        categoryTabs.innerHTML = forumCategories.map(category => {
          const count = category.id === "favorites"
            ? posts.filter(post => post.favoritedBy.includes(forumUserId)).length
            : category.id === "all"
              ? posts.length
              : posts.filter(post => post.category === category.id).length;
          return `<button type="button" class="${activeCategory === category.id ? "active" : ""}" data-category="${category.id}">${category.label} ${count}</button>`;
        }).join("");
      }

      function renderStickers(query = ""){
        const keyword = query.trim().toLowerCase();
        const filtered = forumStickers.filter(sticker => {
          const text = `${sticker.name} ${sticker.code} ${sticker.tags || ""}`.toLowerCase();
          return !keyword || text.includes(keyword);
        });
        stickerPicker.innerHTML = filtered.length
          ? filtered.map(sticker =>
            `<button class="sticker-btn ${sticker.kind}" type="button" data-code="${sticker.code}" title="${sticker.name}" aria-label="插入${sticker.name}"><img src="${sticker.url}" alt="${sticker.name}">${sticker.kind === "photo" ? `<span>${escapeHtml(sticker.caption || sticker.name)}</span>` : ""}</button>`
          ).join("")
          : `<div class="sticker-empty">没有找到这个表情包，换个关键词试试。</div>`;
        const searchKeyword = query.trim() || "最新表情包 梗图";
        if (stickerWebSearch) {
          stickerWebSearch.innerHTML = [
            ["发表情", `https://www.fabiaoqing.com/search/search/keyword/${encodeURIComponent(searchKeyword)}`],
            ["斗图搜索", `https://www.doutub.com/search/${encodeURIComponent(searchKeyword)}`],
            ["梗图搜索", `https://gengtu.net/search?q=${encodeURIComponent(searchKeyword)}`],
            ["必应图片", `https://www.bing.com/images/search?q=${encodeURIComponent(searchKeyword + " 表情包 梗图")}`]
          ].map(([label, url]) => `<a href="${url}" target="_blank" rel="noopener">${label}</a>`).join("");
        }
      }

      renderStickers();
      renderLogin();
      renderCategoryTabs();

      loginForm.addEventListener("submit", async event => {
        event.preventDefault();
        try {
          const username = loginUsername.value.trim();
          const displayName = loginDisplay.value.trim() || username;
          const password = loginPassword.value;
          const result = await forumApi.login({username, displayName, password});
          forumSession = saveForumSession(result.user);
          forumUserId = forumSession.id;
          loginForm.reset();
          renderLogin();
          renderPosts();
          setStatus("登录成功。");
        } catch (error) {
          console.error(error);
          setStatus("登录失败：用户名不能为空，密码至少 3 位；已有账号请确认密码。");
        }
      });

      userbar.addEventListener("click", event => {
        if (!event.target.closest("#forum-logout")) return;
        localStorage.removeItem(forumSessionKey);
        localStorage.removeItem(forumUserKey);
        forumSession = null;
        forumUserId = getForumUserId();
        renderLogin();
        renderPosts();
        setStatus("已退出登录。");
      });

      categoryTabs.addEventListener("click", event => {
        const button = event.target.closest("button[data-category]");
        if (!button) return;
        activeCategory = button.dataset.category;
        localStorage.setItem(forumCategoryKey, activeCategory);
        renderPosts();
      });

      const setStickerPanelOpen = isOpen => {
        stickerPanel.classList.toggle("open", isOpen);
        stickerToggle.setAttribute("aria-expanded", String(isOpen));
        stickerToggle.textContent = isOpen ? "收起表情包" : "选择表情包";
      };
      setStickerPanelOpen(false);
      stickerToggle.addEventListener("click", () => {
        setStickerPanelOpen(!stickerPanel.classList.contains("open"));
      });
      stickerSearch.addEventListener("input", () => renderStickers(stickerSearch.value));
      stickerPresets.addEventListener("click", event => {
        const button = event.target.closest(".sticker-chip");
        if (!button) return;
        stickerSearch.value = button.dataset.query;
        renderStickers(stickerSearch.value);
      });

      document.addEventListener("focusin", event => {
        if (event.target.matches("#forum-content,.reply-box textarea")) {
          focusedTextarea = event.target;
        }
      });

      stickerPicker.addEventListener("click", event => {
        const button = event.target.closest(".sticker-btn");
        if (!button) return;
        const textarea = focusedTextarea || contentInput;
        const code = button.dataset.code;
        const start = textarea.selectionStart || textarea.value.length;
        const end = textarea.selectionEnd || textarea.value.length;
        textarea.value = `${textarea.value.slice(0,start)}${code}${textarea.value.slice(end)}`;
        textarea.focus();
        textarea.selectionStart = textarea.selectionEnd = start + code.length;
        setStickerPanelOpen(false);
      });

      function renderPosts(){
        renderCategoryTabs();
        const visiblePosts = posts.filter(post => {
          if (activeCategory === "favorites") return post.favoritedBy.includes(forumUserId);
          if (activeCategory === "all") return true;
          return post.category === activeCategory;
        });
        if (!visiblePosts.length) {
          feed.innerHTML = `<div class="empty-forum">${activeCategory === "favorites" ? "收藏夹目前为空。可以在帖子下方点击收藏。" : "当前分区还没有帖子。欢迎发布第一条校园话题。"}</div>`;
          return;
        }
        feed.innerHTML = visiblePosts.map(post => `
          <article class="student-post" data-id="${post.id}">
            <header>
              <div class="post-author-row">
                ${renderAvatar(post.author, post.authorAvatar || currentUserAvatar(post.ownerId))}
                <div>
                  <h3>${escapeHtml(post.title)}</h3>
                  <div class="post-meta"><span class="post-category">${escapeHtml(categoryLabel(post.category))}</span>发布者：${escapeHtml(post.author)} · ${escapeHtml(post.createdAt)} · 收藏 ${post.favoritedBy.length} · 投诉 ${post.reportedBy.length}/6</div>
                </div>
              </div>
            </header>
            <div class="post-body">${renderForumText(post.content)}</div>
            <div class="post-actions">
              <button class="forum-btn light ${post.likedBy.includes(forumUserId) ? "is-active" : ""}" type="button" data-action="like">${post.likedBy.includes(forumUserId) ? "取消点赞" : "点赞"} ${post.likes}</button>
              <button class="forum-btn light ${post.favoritedBy.includes(forumUserId) ? "is-active" : ""}" type="button" data-action="favorite">${post.favoritedBy.includes(forumUserId) ? "取消收藏" : "收藏"} ${post.favoritedBy.length}</button>
              <button class="forum-btn light" type="button" data-action="report" ${post.reportedBy.includes(forumUserId) ? "disabled" : ""}>${post.reportedBy.includes(forumUserId) ? "已投诉" : "投诉"}</button>
              ${post.ownerId === forumUserId ? `<button class="forum-btn secondary" type="button" data-action="delete-own">删除我的帖子</button>` : ""}
            </div>
            <div class="reply-list">
              ${post.replies.map(reply => `<div class="reply" data-reply-id="${escapeHtml(reply.id)}"><div class="reply-author-row">${renderAvatar(reply.author, reply.avatarUrl || currentUserAvatar(reply.ownerId))}<div><strong>${escapeHtml(reply.author)}</strong> · <small>${escapeHtml(reply.createdAt)}</small><br>${renderForumText(reply.content)}${reply.ownerId === forumUserId ? `<div class="forum-toolbar"><button class="forum-btn light" type="button" data-action="delete-reply" data-reply-id="${escapeHtml(reply.id)}">撤回回复</button></div>` : ""}</div></div></div>`).join("")}
            </div>
            <form class="reply-box" data-action="reply">
              <label>回复内容</label>
              <textarea maxlength="500" placeholder="写下回复，也可以点上面的表情包插入。"></textarea>
              <div class="forum-toolbar">
                <button class="forum-btn" type="submit">发布回复</button>
                <button class="forum-btn secondary" type="button" data-action="upload">上传图片</button>
              </div>
            </form>
          </article>
        `).join("");
      }

      form.addEventListener("submit", async event => {
        event.preventDefault();
        if (!forumSession) {
          setStatus("请先登录再发布帖子。");
          return;
        }
        const author = forumSession.displayName || forumSession.username || "论坛用户";
        const title = titleInput.value.trim();
        const content = contentInput.value.trim();
        const category = categoryInput.value || "campus";
        if (!title || !content) {
          setStatus("标题和正文都要填写。");
          return;
        }
        const blockedWord = findSensitiveWord(author, title, content);
        if (blockedWord) {
          setStatus(`发布失败：内容包含不适合发布的词语“${blockedWord}”。`);
          return;
        }
        try {
          posts = await forumApi.createPost({
            id:createForumId("post"),
            author,
            title,
            content,
            category,
            ownerId:forumUserId,
            authorAvatar:forumSession.avatarUrl || "",
            likes:0,
            likedBy:[],
            reportedBy:[],
            reports:0,
            createdAt:nowLabel(),
            replies:[]
          }, posts);
          form.reset();
          stickerSearch.value = "";
          renderStickers();
          setStickerPanelOpen(false);
          focusedTextarea = contentInput;
          renderPosts();
          setStatus("帖子已发布，已显示在帖子列表最上方。");
        } catch (error) {
          console.error(error);
          setStatus("发布失败：本地保存或服务器接口出错，请稍后再试。");
        }
      });

      feed.addEventListener("click", async event => {
        const postEl = event.target.closest(".student-post");
        const action = event.target.dataset.action;
        if (!postEl || !action) return;
        const post = posts.find(item => item.id === postEl.dataset.id);
        if (!post) return;
        if (!forumSession && ["like","favorite","report","delete-own","delete-reply","upload"].includes(action)) {
          setStatus("请先登录再操作。");
          return;
        }
        if (action === "like") {
          const wasLiked = post.likedBy.includes(forumUserId);
          posts = await forumApi.likePost(post.id, posts);
          renderPosts();
          setStatus(wasLiked ? "已取消点赞。" : "已点赞。");
        }
        if (action === "favorite") {
          const wasFavorited = post.favoritedBy.includes(forumUserId);
          posts = await forumApi.favoritePost(post.id, posts);
          renderPosts();
          setStatus(wasFavorited ? "已取消收藏。" : "已收藏，可在“我的收藏”查看。");
        }
        if (action === "report") {
          if (post.reportedBy.includes(forumUserId)) {
            setStatus("你已经投诉过这条帖子，不能重复投诉。");
            return;
          }
          post.reportedBy.push(forumUserId);
          post.reports = post.reportedBy.length;
          if (post.reportedBy.length > 5) {
            posts = await forumApi.deletePost(post.id, posts);
            setStatus("该帖子被超过 5 个不同用户投诉，已自动删除。");
          } else {
            posts = await forumApi.reportPost(post.id, posts);
            setStatus(`已投诉。当前 ${post.reportedBy.length}/6，超过 5 个不同用户会自动删除。`);
          }
          renderPosts();
        }
        if (action === "delete-own") {
          if (post.ownerId !== forumUserId) {
            setStatus("只能删除自己在当前浏览器发布的帖子。");
            return;
          }
          posts = await forumApi.deleteOwnPost(post.id, posts);
          renderPosts();
          setStatus("帖子已删除。");
        }
        if (action === "delete-reply") {
          const replyId = event.target.dataset.replyId;
          const reply = post.replies.find(item => item.id === replyId);
          if (!reply || reply.ownerId !== forumUserId) {
            setStatus("只能撤回自己发布的回复。");
            return;
          }
          posts = await forumApi.deleteReply(post.id, replyId, posts);
          renderPosts();
          setStatus("回复已撤回。");
        }
        if (action === "upload") {
          setStatus("图片服务暂时不可用，请稍后再试。");
        }
      });

      feed.addEventListener("submit", async event => {
        const replyForm = event.target.closest(".reply-box");
        if (!replyForm) return;
        event.preventDefault();
        if (!forumSession) {
          setStatus("请先登录再回复。");
          return;
        }
        const postEl = event.target.closest(".student-post");
        const post = posts.find(item => item.id === postEl.dataset.id);
        const author = forumSession.displayName || forumSession.username || "论坛用户";
        const content = replyForm.querySelector("textarea").value.trim();
        if (!content) {
          setStatus("回复内容不能为空。");
          return;
        }
        const blockedWord = findSensitiveWord(author, content);
        if (blockedWord) {
          setStatus(`回复失败：内容包含不适合发布的词语“${blockedWord}”。`);
          return;
        }
        try {
          posts = await forumApi.addReply(post.id, {id:createForumId("reply"), author, content, ownerId:forumUserId, avatarUrl:forumSession.avatarUrl || "", createdAt:nowLabel()}, posts);
          renderPosts();
          setStatus("回复已发布。");
        } catch (error) {
          console.error(error);
          setStatus("回复失败：本地保存或服务器接口出错，请稍后再试。");
        }
      });

      uploadButton.addEventListener("click", () => setStatus("图片服务暂时不可用，请稍后再试。"));
      resetButton.addEventListener("click", async () => {
        posts = await forumApi.restoreDemo();
        stickerSearch.value = "";
        renderStickers();
        setStickerPanelOpen(false);
        renderPosts();
        setStatus("已恢复示例帖子。");
      });

      renderPosts();
    }

    initForum();

    async function initProfile(){
      if (pageKey !== "profile") return;
      const head = document.getElementById("profile-head");
      const stats = document.getElementById("profile-stats");
      const tabs = document.getElementById("profile-tabs");
      const list = document.getElementById("profile-list");
      if (!head || !stats || !tabs || !list) return;
      let session = getForumSession();
      const forumUserId = getForumUserId();
      let posts = await forumApi.listPosts();
      let profile = await forumApi.getProfile(forumUserId, posts);
      let activeTab = "favorites";
      const categoryLabel = id => (forumCategories.find(category => category.id === id) || forumCategories[0]).label;

      function getDisplayName(){
        return session ? (session.displayName || session.username || "论坛用户") : "未登录用户";
      }

      function getUsername(){
        return session ? (session.username || session.id) : "请先登录论坛账号";
      }

      function getAvatarUrl(){
        return (session && session.avatarUrl) || (profile.user && profile.user.avatarUrl) || "";
      }

      function fileToAvatarDataUrl(file){
        return new Promise((resolve, reject) => {
          if (!file || !file.type.startsWith("image/")) {
            reject(new Error("invalid_image"));
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            const image = new Image();
            image.onload = () => {
              const size = 320;
              const canvas = document.createElement("canvas");
              canvas.width = size;
              canvas.height = size;
              const context = canvas.getContext("2d");
              const side = Math.min(image.width, image.height);
              const sx = (image.width - side) / 2;
              const sy = (image.height - side) / 2;
              context.drawImage(image, sx, sy, side, side, 0, 0, size, size);
              resolve(canvas.toDataURL("image/jpeg", .86));
            };
            image.onerror = () => reject(new Error("invalid_image"));
            image.src = reader.result;
          };
          reader.onerror = () => reject(new Error("read_failed"));
          reader.readAsDataURL(file);
        });
      }

      const renderPostItem = (post, mode) => `
        <article class="profile-item">
          <h3>${escapeHtml(post.title)}</h3>
          <div class="post-meta">
            <span class="post-category">${escapeHtml(categoryLabel(post.category))}</span>
            ${mode === "favorite" ? `作者：${escapeHtml(post.author)}` : "我的投稿"} · ${escapeHtml(post.createdAt)} · 点赞 ${post.likedBy.length} · 收藏 ${post.favoritedBy.length}
          </div>
          <p>${renderForumText(post.content)}</p>
          <div class="forum-toolbar">
            <a class="forum-btn light" href="portal.html?page=forum">去论坛查看</a>
          </div>
        </article>
      `;

      const renderLikeItem = item => `
        <article class="profile-item">
          <h3>${escapeHtml(item.title)}</h3>
          <div class="post-meta">发布时间：${escapeHtml(item.createdAt)} · 收到点赞 ${item.likes}</div>
          ${item.likedBy.length
            ? `<div class="profile-like-list">${item.likedBy.map(id => `<span>${escapeHtml(id.startsWith("legacy-like") ? "历史点赞用户" : id)}</span>`).join("")}</div>`
            : `<p>这条帖子暂时还没有收到点赞。</p>`}
        </article>
      `;

      function renderTabs(){
        const tabItems = [
          ["favorites", `我的收藏 ${profile.favorites.length}`],
          ["posts", `我的投稿 ${profile.posts.length}`],
          ["likes", `获赞明细 ${profile.stats.receivedLikes}`]
        ];
        tabs.innerHTML = tabItems.map(([id, label]) =>
          `<button type="button" class="${activeTab === id ? "active" : ""}" data-profile-tab="${id}">${label}</button>`
        ).join("");
      }

      function renderList(){
        if (!session) {
          list.innerHTML = `
            <div class="empty-forum">
              当前还没有登录论坛账号。请先进入学生论坛登录或注册，然后回到个人中心查看收藏、投稿和获赞。
              <div class="forum-toolbar"><a class="forum-btn" href="portal.html?page=forum">去论坛登录</a></div>
            </div>`;
          return;
        }
        if (activeTab === "favorites") {
          list.innerHTML = profile.favorites.length
            ? profile.favorites.map(post => renderPostItem(post, "favorite")).join("")
            : `<div class="empty-forum">收藏夹目前为空。可以在论坛帖子下方点击“收藏”。</div>`;
          return;
        }
        if (activeTab === "posts") {
          list.innerHTML = profile.posts.length
            ? profile.posts.map(post => renderPostItem(post, "post")).join("")
            : `<div class="empty-forum">你还没有发布过帖子。进入论坛后可以选择分区发布第一条内容。</div>`;
          return;
        }
        list.innerHTML = profile.likedDetails.length
          ? profile.likedDetails.map(renderLikeItem).join("")
          : `<div class="empty-forum">你还没有发布过帖子，因此暂无获赞记录。</div>`;
      }

      function renderHead(){
        const displayName = getDisplayName();
        const avatarUrl = getAvatarUrl();
        head.innerHTML = `
          ${renderAvatar(displayName, avatarUrl, "profile-avatar")}
          <div class="profile-name">
            <h3>${escapeHtml(displayName)}</h3>
            <p>@${escapeHtml(getUsername())} · ${session ? "论坛账号已登录" : "游客状态"}</p>
            ${session ? `
              <div class="avatar-picker">
                <label for="profile-avatar-input">更换头像</label>
                <input id="profile-avatar-input" type="file" accept="image/*">
                <span class="avatar-hint">建议使用正方形图片，保存后论坛里的头像会同步更新。</span>
              </div>` : ""}
          </div>
          <div class="forum-toolbar">
            <a class="forum-btn" href="portal.html?page=forum">进入论坛</a>
            ${session ? `<button class="forum-btn light" type="button" id="profile-logout">退出登录</button>` : ""}
          </div>
        `;
      }

      function renderStats(){
        stats.innerHTML = [
          ["投稿", profile.stats.posts],
          ["收藏", profile.stats.favorites],
          ["获赞", profile.stats.receivedLikes],
          ["回复", profile.stats.replies]
        ].map(([label, value]) => `<div class="profile-stat"><strong>${value}</strong><span>${label}</span></div>`).join("");
      }

      renderHead();
      renderStats();
      renderTabs();
      renderList();

      tabs.addEventListener("click", event => {
        const button = event.target.closest("button[data-profile-tab]");
        if (!button) return;
        activeTab = button.dataset.profileTab;
        renderTabs();
        renderList();
      });
      head.addEventListener("click", event => {
        if (!event.target.closest("#profile-logout")) return;
        localStorage.removeItem(forumSessionKey);
        localStorage.removeItem(forumUserKey);
        window.location.reload();
      });
      head.addEventListener("change", async event => {
        const input = event.target.closest("#profile-avatar-input");
        if (!input || !session) return;
        const file = input.files && input.files[0];
        if (!file) return;
        try {
          const avatarUrl = await fileToAvatarDataUrl(file);
          const result = await forumApi.updateProfile(forumUserId, {avatarUrl}, posts);
          session = saveForumSession({...session, avatarUrl});
          posts = normalizeForumPosts(result.posts || await forumApi.listPosts());
          profile = await forumApi.getProfile(forumUserId, posts);
          renderHead();
          renderStats();
          renderTabs();
          renderList();
        } catch (error) {
          console.error(error);
          list.innerHTML = `<div class="empty-forum">头像保存失败，请换一张 JPG、PNG 或 WebP 图片再试。</div>`;
        }
      });
    }

    initProfile();

    async function initAdmin(){
      if (pageKey !== "admin") return;
      const authCard = document.getElementById("admin-auth-card");
      const authForm = document.getElementById("admin-auth-form");
      const authAnswer = document.getElementById("admin-auth-answer");
      const secureArea = document.getElementById("admin-secure-area");
      const stats = document.getElementById("admin-stats");
      const list = document.getElementById("admin-list");
      const repliesBoard = document.getElementById("admin-replies-board");
      const status = document.getElementById("admin-status");
      const exportButton = document.getElementById("admin-export");
      const resetReportsButton = document.getElementById("admin-reset-reports");
      const restoreButton = document.getElementById("admin-restore-demo");
      const lockButton = document.getElementById("admin-lock");
      const setStatus = message => {
        status.textContent = message;
        clearTimeout(initAdmin.statusTimer);
        initAdmin.statusTimer = setTimeout(()=>{ status.textContent = ""; }, 2600);
      };
      let adminSession = null;
      let posts = await forumApi.listPosts();

      try {
        adminSession = JSON.parse(sessionStorage.getItem(forumAdminSessionKey)) || null;
      } catch {
        adminSession = null;
      }

      function renderGate(){
        const unlocked = Boolean(adminSession && adminSession.token);
        authCard.style.display = unlocked ? "none" : "grid";
        secureArea.classList.toggle("is-locked", !unlocked);
        if (unlocked) renderAdmin();
      }

      const idList = values => values.length ? values.map(value => `<span>${escapeHtml(value)}</span>`).join("") : `<span>暂无</span>`;

      function allReplies(){
        return posts.flatMap(post => post.replies.map(reply => ({...reply, postId:post.id, postTitle:post.title, postAuthor:post.author})));
      }

      function renderAllReplies(){
        const replies = allReplies();
        repliesBoard.innerHTML = replies.length ? replies.map(reply => `
          <div class="admin-reply" data-id="${escapeHtml(reply.postId)}" data-reply-id="${escapeHtml(reply.id)}">
            <div>
              <strong>${escapeHtml(reply.author)}</strong> · <small>${escapeHtml(reply.createdAt)}</small>
              <p>所属帖子：${escapeHtml(reply.postTitle)} · 帖子作者：${escapeHtml(reply.postAuthor)}</p>
              <p>${renderForumText(reply.content)}</p>
            </div>
            <button class="forum-btn light" type="button" data-action="delete-reply-global" data-reply-id="${escapeHtml(reply.id)}">删除回复</button>
          </div>
        `).join("") : `<div class="empty-forum">目前没有任何回复。</div>`;
      }

      function renderAdmin(){
        const replyCount = posts.reduce((sum, post) => sum + post.replies.length, 0);
        const reportCount = posts.reduce((sum, post) => sum + post.reportedBy.length, 0);
        stats.innerHTML = `
          <div class="admin-card"><strong>${posts.length}</strong><span>帖子总数</span></div>
          <div class="admin-card"><strong>${replyCount}</strong><span>回复总数</span></div>
          <div class="admin-card"><strong>${reportCount}</strong><span>投诉总数</span></div>
        `;
        renderAllReplies();
        if (!posts.length) {
          list.innerHTML = `<div class="empty-forum">后台暂无帖子数据。</div>`;
          return;
        }
        list.innerHTML = posts.map(post => `
          <article class="admin-item" data-id="${post.id}">
            <h3>${escapeHtml(post.title)}</h3>
            <p>作者：${escapeHtml(post.author)} · ${escapeHtml(post.createdAt)} · 点赞 ${post.likes} · 投诉 ${post.reportedBy.length}/6 · 回复 ${post.replies.length}</p>
            <div class="forum-toolbar">
              <button class="forum-btn light" type="button" data-action="toggle-detail">查看详情</button>
              <button class="forum-btn light" type="button" data-action="clear-report">清空本帖投诉</button>
              <button class="forum-btn secondary" type="button" data-action="delete">删除帖子</button>
            </div>
            <div class="admin-detail" hidden>
              <h4>帖子正文</h4>
              <p>${renderForumText(post.content)}</p>
              <h4>互动记录</h4>
              <div class="profile-like-list">
                <span>点赞 ${post.likedBy.length}</span>
                <span>收藏 ${post.favoritedBy.length}</span>
                <span>投诉 ${post.reportedBy.length}</span>
              </div>
              <h4>点赞账号</h4>
              <div class="profile-like-list">${idList(post.likedBy)}</div>
              <h4>收藏账号</h4>
              <div class="profile-like-list">${idList(post.favoritedBy)}</div>
              <h4>投诉账号</h4>
              <div class="profile-like-list">${idList(post.reportedBy)}</div>
              <h4>回复管理</h4>
              ${post.replies.length ? post.replies.map(reply => `
                <div class="admin-reply" data-reply-id="${escapeHtml(reply.id)}">
                  <div><strong>${escapeHtml(reply.author)}</strong> · <small>${escapeHtml(reply.createdAt)}</small><br>${renderForumText(reply.content)}</div>
                  <button class="forum-btn light" type="button" data-action="delete-reply" data-reply-id="${escapeHtml(reply.id)}">删除回复</button>
                </div>
              `).join("") : `<div class="empty-forum">这条帖子暂无回复。</div>`}
            </div>
          </article>
        `).join("");
      }

      authForm.addEventListener("submit", async event => {
        event.preventDefault();
        try {
          const result = await forumApi.adminLogin({answer:authAnswer.value.trim()});
          adminSession = result;
          sessionStorage.setItem(forumAdminSessionKey, JSON.stringify(result));
          authForm.reset();
          renderGate();
          setStatus("认证成功，已进入后台。");
        } catch (error) {
          console.error(error);
          setStatus("认证失败，答案不正确。");
        }
      });

      list.addEventListener("click", async event => {
        const item = event.target.closest(".admin-item");
        const action = event.target.dataset.action;
        if (!item || !action) return;
        if (!adminSession || !adminSession.token) {
          setStatus("请先通过后台认证。");
          return;
        }
        const post = posts.find(value => value.id === item.dataset.id);
        if (!post) return;
        if (action === "toggle-detail") {
          const detail = item.querySelector(".admin-detail");
          if (detail) detail.hidden = !detail.hidden;
          event.target.textContent = detail && !detail.hidden ? "收起详情" : "查看详情";
        }
        if (action === "clear-report") {
          posts = await forumApi.clearPostReports(post.id, posts);
          renderAdmin();
          setStatus("已清空这条帖子的投诉记录。");
        }
        if (action === "delete") {
          posts = await forumApi.deletePost(post.id, posts, adminSession.token);
          renderAdmin();
          setStatus("帖子已删除。");
        }
        if (action === "delete-reply") {
          posts = await forumApi.deleteReply(post.id, event.target.dataset.replyId, posts, adminSession.token);
          renderAdmin();
          setStatus("回复已删除。");
        }
      });

      repliesBoard.addEventListener("click", async event => {
        const item = event.target.closest(".admin-reply");
        const action = event.target.dataset.action;
        if (!item || action !== "delete-reply-global") return;
        if (!adminSession || !adminSession.token) {
          setStatus("请先通过后台认证。");
          return;
        }
        posts = await forumApi.deleteReply(item.dataset.id, event.target.dataset.replyId, posts, adminSession.token);
        renderAdmin();
        setStatus("回复已删除。");
      });

      exportButton.addEventListener("click", () => {
        if (!adminSession || !adminSession.token) return setStatus("请先通过后台认证。");
        const blob = new Blob([JSON.stringify(posts, null, 2)], {type:"application/json"});
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `bjzx-forum-${Date.now()}.json`;
        link.click();
        URL.revokeObjectURL(url);
        setStatus("帖子数据已导出。");
      });

      resetReportsButton.addEventListener("click", async () => {
        if (!adminSession || !adminSession.token) return setStatus("请先通过后台认证。");
        posts = await forumApi.clearAllReports(posts);
        renderAdmin();
        setStatus("所有投诉记录已清空。");
      });

      restoreButton.addEventListener("click", async () => {
        if (!adminSession || !adminSession.token) return setStatus("请先通过后台认证。");
        posts = await forumApi.restoreDemo();
        renderAdmin();
        setStatus("已恢复示例帖子。");
      });

      lockButton.addEventListener("click", () => {
        adminSession = null;
        sessionStorage.removeItem(forumAdminSessionKey);
        renderGate();
        setStatus("已退出后台。");
      });

      renderGate();
    }

    initAdmin();
  </script>
</body>
</html>
