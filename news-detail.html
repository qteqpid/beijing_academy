<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最新动态 | 北中观察站</title>
  <link rel="icon" href="bjzx-favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="bjzx-favicon.png">
  <style>
    :root{
      --red:#b50018;
      --red-2:#e1192d;
      --ink:#151515;
      --muted:#666;
      --line:#e7e7e7;
      --paper:#fff;
      --soft:#f6f6f6;
      --cream:#fbfaf7;
      --shadow:0 24px 70px rgba(18,24,40,.10);
      --shadow-strong:0 34px 90px rgba(18,24,40,.16);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:"Microsoft Yahei","PingFang SC",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 16%,rgba(181,0,24,.06),transparent 24%),
        radial-gradient(circle at 84% 28%,rgba(16,120,140,.05),transparent 26%),
        var(--paper);
    }
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    .scroll-progress{
      position:fixed;
      left:0;
      top:0;
      width:0;
      height:4px;
      background:linear-gradient(90deg,var(--red),#ff3154);
      z-index:100;
      box-shadow:0 0 24px rgba(225,25,45,.45);
      pointer-events:none;
    }

    .top-rule{
      height:5px;
      background:linear-gradient(90deg,#8b0011,var(--red),#ff394f);
      position:relative;
      overflow:hidden;
    }
    .top-rule::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(110deg,transparent 0 34%,rgba(255,255,255,.22) 48%,transparent 62%);
      transform:translateX(-70%);
      animation:topSheen 7s ease-in-out infinite;
    }
    .site-header{
      background:#fff;
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:20;
      transition:box-shadow .28s ease;
    }
    body.is-scrolled .site-header{
      box-shadow:0 18px 46px rgba(16,24,40,.12);
    }
    .header-inner{
      width:min(1180px,calc(100% - 48px));
      min-height:86px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:40px;
    }
    .logo img{width:180px;height:auto}
    .logo img{transition:transform .24s ease}
    .logo:hover img{transform:translateY(-2px)}
    .nav{
      display:flex;
      gap:34px;
      color:#344054;
      font-size:16px;
      font-weight:800;
      white-space:nowrap;
    }
    .nav a{
      padding:31px 0;
      position:relative;
    }
    .nav a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:24px;
      width:0;
      height:2px;
      background:var(--red);
      transition:width .24s ease;
    }
    .nav a:hover::after,
    .nav a.active::after{width:100%}

    .page-hero{
      background:
        linear-gradient(180deg,#fff 0%,var(--cream) 100%);
      border-bottom:1px solid var(--line);
      padding:76px 0 56px;
      position:relative;
      overflow:hidden;
    }
    .page-hero::before{
      content:"北京中学";
      position:absolute;
      right:-26px;
      top:6px;
      font-size:116px;
      font-weight:900;
      color:rgba(181,0,24,.055);
      letter-spacing:.02em;
    }
    .page-hero-inner{
      width:min(1180px,calc(100% - 48px));
      margin:0 auto;
      display:grid;
      grid-template-columns:minmax(0,1fr) 260px;
      gap:60px;
      align-items:end;
      position:relative;
      z-index:1;
    }
    .breadcrumb{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      color:var(--muted);
      font-size:14px;
      margin-bottom:42px;
    }
    .breadcrumb a{color:var(--red);font-weight:800}
    .category{
      color:var(--red);
      font-size:13px;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      margin-bottom:18px;
    }
    .page-title{
      max-width:830px;
      font-size:56px;
      line-height:1.12;
      letter-spacing:-.02em;
      font-weight:900;
      opacity:0;
      transform:translateY(22px);
      animation:riseIn .72s ease .1s forwards;
      text-wrap:balance;
    }
    .hero-meta{
      border-left:5px solid var(--red);
      padding-left:22px;
      color:#444;
      font-weight:800;
      line-height:1.9;
      opacity:0;
      transform:translateY(18px);
      animation:riseIn .72s ease .22s forwards;
    }
    .hero-meta span{
      display:block;
      color:var(--muted);
      font-size:13px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .article-shell{
      width:min(1180px,calc(100% - 48px));
      margin:58px auto 96px;
      display:grid;
      grid-template-columns:minmax(0,760px) 300px;
      gap:78px;
      align-items:start;
    }
    .lead-image{
      width:100%;
      aspect-ratio:16/9;
      object-fit:cover;
      margin-bottom:44px;
      background:#ddd;
      box-shadow:22px 22px 0 var(--red),0 26px 70px rgba(18,24,40,.14);
      transition:transform .42s ease,box-shadow .42s ease,filter .42s ease;
    }
    .lead-image:hover{
      transform:translate(-6px,-6px);
      box-shadow:34px 34px 0 var(--red);
      filter:saturate(1.05) contrast(1.04);
    }
    .article-content{
      font-size:18px;
      line-height:2;
      background:#fff;
      border:1px solid var(--line);
      padding:38px 42px;
      box-shadow:0 18px 54px rgba(18,24,40,.065);
    }
    .article-content p{margin-bottom:24px}
    .article-content > *{
      opacity:0;
      transform:translateY(20px);
      transition:opacity .68s ease,transform .68s ease;
    }
    .article-content > *.in-view{
      opacity:1;
      transform:translateY(0);
    }
    .article-content h2{
      margin:48px 0 18px;
      font-size:30px;
      line-height:1.3;
      border-left:6px solid var(--red);
      padding-left:16px;
    }
    .article-content blockquote{
      margin:42px 0;
      padding:30px 34px;
      border-left:8px solid var(--red);
      background:var(--soft);
      font-size:24px;
      line-height:1.65;
      font-weight:900;
      position:relative;
      overflow:hidden;
    }
    .article-content blockquote::after{
      content:"";
      position:absolute;
      right:-40px;
      bottom:-40px;
      width:120px;
      height:120px;
      border:22px solid rgba(181,0,24,.08);
      border-radius:50%;
    }
    .side-panel{
      position:sticky;
      top:116px;
      border-top:6px solid var(--red);
      background:#fff;
      box-shadow:var(--shadow);
      padding:28px;
      transition:transform .28s ease,box-shadow .28s ease;
    }
    .side-panel:hover{
      transform:translateY(-4px);
      box-shadow:var(--shadow-strong);
    }
    .side-panel h3{
      font-size:22px;
      margin-bottom:22px;
    }
    .side-list{
      list-style:none;
      display:grid;
      gap:0;
      border-top:1px solid var(--line);
    }
    .side-list a{
      display:block;
      padding:15px 0;
      border-bottom:1px solid var(--line);
      color:#333;
      font-weight:800;
      line-height:1.5;
      transition:color .22s ease,transform .22s ease;
    }
    .side-list a:hover{
      color:var(--red);
      transform:translateX(6px);
    }
    .back-link{
      display:inline-flex;
      margin-top:28px;
      color:var(--red);
      font-weight:900;
      border-bottom:2px solid var(--red);
      padding-bottom:5px;
      transition:transform .22s ease;
    }
    .back-link:hover{transform:translateX(-6px)}
    .footer{
      background:
        linear-gradient(135deg,#111 0%,#1b1b1b 58%,#27070b 100%);
      color:#fff;
      padding:44px 0 24px;
      position:relative;
      overflow:hidden;
    }
    .footer::before{
      content:"北中观察站";
      position:absolute;
      right:-18px;
      top:0;
      font-size:88px;
      font-weight:900;
      color:rgba(255,255,255,.035);
    }
    .footer-inner{
      width:min(1180px,calc(100% - 48px));
      margin:0 auto;
      display:flex;
      justify-content:flex-start;
      gap:32px;
      align-items:center;
      position:relative;
      z-index:1;
    }
    .footer p{color:rgba(255,255,255,.74);margin-top:14px}

    @keyframes riseIn{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
    @keyframes topSheen{
      0%,42%{transform:translateX(-80%)}
      68%,100%{transform:translateX(120%)}
    }

    @media (max-width:900px){
      .header-inner,
      .page-hero-inner,
      .article-shell,
      .footer-inner{
        grid-template-columns:1fr;
        width:min(100% - 32px,1180px);
      }
      .header-inner{align-items:flex-start;flex-direction:column;padding:18px 0;gap:8px}
      .nav{width:100%;overflow:auto}
      .nav a{padding:10px 0 16px}
      .page-title{font-size:40px}
      .page-hero{padding:48px 0 40px}
      .article-shell{gap:38px;margin-top:36px}
      .side-panel{position:relative;top:auto}
    }
  </style>
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"></div>
  <div class="top-rule"></div>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">
        <img src="bjzx-logo.jpg" alt="北京中学 Beijing Academy">
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="portal.html?page=about">学校概况</a>
        <a class="active" href="index.html#news">最新动态</a>
        <a href="portal.html?page=student-life">校园文化</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="page-hero-inner">
        <div>
          <div class="breadcrumb">
            <a href="index.html">Home</a>
            <span>/</span>
            <a href="index.html#news">News</a>
            <span>/</span>
            <span id="breadcrumb-title">最新动态</span>
          </div>
          <div class="category" id="article-category">News</div>
          <h1 class="page-title" id="article-title">最新动态</h1>
        </div>
        <div class="hero-meta">
          <span>Published</span>
          <time id="article-date">2026.07</time>
          <span style="margin-top:18px;">Beijing Academy</span>
          北中观察站
        </div>
      </div>
    </section>

    <div class="article-shell">
      <article>
        <img class="lead-image" id="article-image" src="bjzx-news-1.jpg" alt="北京中学新闻配图">
        <div class="article-content" id="article-content"></div>
        <a class="back-link" href="index.html#news">返回最新动态</a>
      </article>

      <aside class="side-panel">
        <h3>Related News</h3>
        <ul class="side-list" id="related-news"></ul>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>北中观察站 ©2026 | 学生自主研发网站 · 非官方学习展示页面</p>
    </div>
  </footer>

  <script>
    (() => {
      const block = event => {
        event.preventDefault();
        event.stopPropagation();
      };
      document.addEventListener("contextmenu", block, true);
      document.addEventListener("dragstart", block, true);
      document.addEventListener("selectstart", block, true);
      document.addEventListener("keydown", event => {
        const key = event.key.toLowerCase();
        const isDevToolsKey = event.key === "F12"
          || (event.ctrlKey && event.shiftKey && ["i","j","c"].includes(key))
          || (event.metaKey && event.altKey && ["i","j","c"].includes(key))
          || ((event.ctrlKey || event.metaKey) && ["u","s"].includes(key));
        if (isDevToolsKey) block(event);
      }, true);
    })();

    const articles = {
      "1":{
        title:"北京中学科技分校2026年“1+3”录取公告",
        date:"2026.07",
        category:"Admissions / 公告",
        image:"bjzx-news-1.jpg",
        sourceUrl:"https://www.beijingacademy.com.cn/cms/bjzx/zxdt1/3904.jhtml",
        body:`
          <p>北京中学官网“最新动态”栏目收录了《北京中学科技分校2026年“1+3”录取公告》，列表日期为 07-27。</p>
          <p>官网文章页显示标题为《北京中学科技分校2026年“1+3”录取公告》，来源为“本网”，发布时间为 2026-07-27 18:00。</p>
          <h2>原文附件</h2>
          <p>官网文章正文提供了同名 PDF 附件《北京中学科技分校2026年“1+3”录取公告.pdf》。涉及录取名单、报到安排、材料要求等具体信息时，应打开官网原文或附件核对。</p>
          <blockquote>本页只做来源明确的站内转引，不改写录取结果，不新增未经核验的招生细节。</blockquote>
          <h2>核验说明</h2>
          <p>本条内容的可核验事实包括标题、栏目、来源、发布时间和 PDF 附件名称，均来自北京中学官网页面。北中观察站不替代学校正式发布渠道。</p>
        `
      },
      "2":{
        title:"北京中学国际部2026届毕业典礼暨成人礼圆满礼成",
        date:"2026.06",
        category:"Campus Life / 校园生活",
        image:"bjzx-news-2.jpg",
        sourceUrl:"https://mp.weixin.qq.com/s/QdsxXU8GogkBL4tUs_bSEQ",
        body:`
          <p>北京中学官网“最新动态”列表收录了《北京中学国际部2026届毕业典礼暨成人礼圆满礼成》，列表日期为 06-11，并链接到微信文章。</p>
          <p>因此，本页只保留能从官网列表核验的标题、发布时间月份和来源入口，不再编写典礼现场细节、发言内容或活动流程。</p>
          <h2>原文入口</h2>
          <p>完整内容应以官网列表跳转的微信原文为准。北中观察站在这里提供站内阅读入口和来源说明，方便从首页新闻卡片继续跳转。</p>
          <blockquote>未在可核验网页中确认的发言、人物、流程和现场描述，不写入本文。</blockquote>
          <h2>核验说明</h2>
          <p>本条内容的可核验事实包括标题、官网列表日期和微信原文链接，均来自北京中学官网“最新动态”列表。</p>
        `
      },
      "3":{
        title:"北京市“国家级义务教育教学改革实验区、实验校”展示交流活动在北京中学成功举办",
        date:"2026.06",
        category:"Research / 教学研究",
        image:"bjzx-news-3.jpg",
        sourceUrl:"https://mp.weixin.qq.com/s/zwoTWT9kN4UhOgh_JWpfNA",
        body:`
          <p>北京中学官网“最新动态”列表收录了《北京市“国家级义务教育教学改革实验区、实验校”展示交流活动在北京中学成功举办》，列表日期为 06-05，并链接到微信文章。</p>
          <p>本条替换了此前无法核验的“主题教育与校园实践活动”表述，改为官网列表中可以查到的真实标题。</p>
          <h2>原文入口</h2>
          <p>完整活动内容应以官网列表跳转的微信原文为准。北中观察站只做站内摘要入口，不添加未经来源确认的现场流程或活动细节。</p>
          <blockquote>本文标题、日期和来源入口来自北京中学官网“最新动态”列表。</blockquote>
          <h2>核验说明</h2>
          <p>本条内容的可核验事实包括标题、官网列表日期和微信原文链接。没有来源支持的活动细节已经移除。</p>
        `
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = articles[params.get("id")] ? params.get("id") : "1";
    const article = articles[id];

    document.title = `${article.title} | 北中观察站`;
    document.getElementById("breadcrumb-title").textContent = article.title;
    document.getElementById("article-category").textContent = article.category;
    document.getElementById("article-title").textContent = article.title;
    document.getElementById("article-date").textContent = article.date;
    document.getElementById("article-image").src = article.image;
    document.getElementById("article-content").innerHTML = article.body + `<h2>资料来源</h2><p><a href="${article.sourceUrl}" target="_blank" rel="noopener">打开原始来源</a></p>`;

    const related = document.getElementById("related-news");
    Object.entries(articles).forEach(([key,item])=>{
      const li = document.createElement("li");
      li.innerHTML = `<a href="news-detail.html?id=${key}">${item.title}</a>`;
      related.appendChild(li);
    });

    const scrollProgress = document.querySelector(".scroll-progress");
    const updateScrollEffects = ()=>{
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const progress = maxScroll > 0 ? (window.scrollY / maxScroll) * 100 : 0;
      if (scrollProgress) scrollProgress.style.width = `${progress}%`;
      document.body.classList.toggle("is-scrolled", window.scrollY > 24);
    };
    updateScrollEffects();
    window.addEventListener("scroll", updateScrollEffects, {passive:true});

    const articleBlocks = document.querySelectorAll(".article-content > *");
    if ("IntersectionObserver" in window) {
      const observer = new IntersectionObserver((entries)=>{
        entries.forEach(entry=>{
          if (entry.isIntersecting) {
            entry.target.classList.add("in-view");
            observer.unobserve(entry.target);
          }
        });
      }, {threshold:.2});
      articleBlocks.forEach((block,index)=>{
        block.style.transitionDelay = `${Math.min(index * 70, 420)}ms`;
        observer.observe(block);
      });
    } else {
      articleBlocks.forEach(block=>block.classList.add("in-view"));
    }
  </script>
</body>
</html>
