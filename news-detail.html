<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最新动态 | 北京中学</title>
  <style>
    :root{
      --red:#b50018;
      --red-2:#e1192d;
      --ink:#151515;
      --muted:#666;
      --line:#e7e7e7;
      --paper:#fff;
      --soft:#f6f6f6;
      --cream:#fbfaf7;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:"Microsoft Yahei","PingFang SC",sans-serif;
      color:var(--ink);
      background:var(--paper);
    }
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}

    .top-rule{
      height:5px;
      background:linear-gradient(90deg,#8b0011,var(--red),#ff394f);
    }
    .site-header{
      background:#fff;
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:20;
    }
    .header-inner{
      width:min(1180px,calc(100% - 48px));
      min-height:86px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:40px;
    }
    .logo img{width:180px;height:auto}
    .nav{
      display:flex;
      gap:34px;
      color:#344054;
      font-size:16px;
      font-weight:800;
      white-space:nowrap;
    }
    .nav a{
      padding:31px 0;
      position:relative;
    }
    .nav a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:24px;
      width:0;
      height:2px;
      background:var(--red);
      transition:width .24s ease;
    }
    .nav a:hover::after,
    .nav a.active::after{width:100%}

    .page-hero{
      background:var(--cream);
      border-bottom:1px solid var(--line);
      padding:76px 0 56px;
    }
    .page-hero-inner{
      width:min(1180px,calc(100% - 48px));
      margin:0 auto;
      display:grid;
      grid-template-columns:minmax(0,1fr) 260px;
      gap:60px;
      align-items:end;
    }
    .breadcrumb{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      color:var(--muted);
      font-size:14px;
      margin-bottom:42px;
    }
    .breadcrumb a{color:var(--red);font-weight:800}
    .category{
      color:var(--red);
      font-size:13px;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      margin-bottom:18px;
    }
    .page-title{
      max-width:830px;
      font-size:56px;
      line-height:1.12;
      letter-spacing:-.02em;
      font-weight:900;
    }
    .hero-meta{
      border-left:5px solid var(--red);
      padding-left:22px;
      color:#444;
      font-weight:800;
      line-height:1.9;
    }
    .hero-meta span{
      display:block;
      color:var(--muted);
      font-size:13px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .article-shell{
      width:min(1180px,calc(100% - 48px));
      margin:58px auto 96px;
      display:grid;
      grid-template-columns:minmax(0,760px) 300px;
      gap:78px;
      align-items:start;
    }
    .lead-image{
      width:100%;
      aspect-ratio:16/9;
      object-fit:cover;
      margin-bottom:44px;
      background:#ddd;
    }
    .article-content{
      font-size:18px;
      line-height:2;
    }
    .article-content p{margin-bottom:24px}
    .article-content h2{
      margin:48px 0 18px;
      font-size:30px;
      line-height:1.3;
      border-left:6px solid var(--red);
      padding-left:16px;
    }
    .article-content blockquote{
      margin:42px 0;
      padding:30px 34px;
      border-left:8px solid var(--red);
      background:var(--soft);
      font-size:24px;
      line-height:1.65;
      font-weight:900;
    }
    .side-panel{
      position:sticky;
      top:116px;
      border-top:6px solid var(--red);
      background:#fff;
      box-shadow:0 24px 64px rgba(16,24,40,.09);
      padding:28px;
    }
    .side-panel h3{
      font-size:22px;
      margin-bottom:22px;
    }
    .side-list{
      list-style:none;
      display:grid;
      gap:0;
      border-top:1px solid var(--line);
    }
    .side-list a{
      display:block;
      padding:15px 0;
      border-bottom:1px solid var(--line);
      color:#333;
      font-weight:800;
      line-height:1.5;
    }
    .side-list a:hover{color:var(--red)}
    .back-link{
      display:inline-flex;
      margin-top:28px;
      color:var(--red);
      font-weight:900;
      border-bottom:2px solid var(--red);
      padding-bottom:5px;
    }
    .footer{
      background:#171717;
      color:#fff;
      padding:44px 0 24px;
    }
    .footer-inner{
      width:min(1180px,calc(100% - 48px));
      margin:0 auto;
      display:flex;
      justify-content:space-between;
      gap:32px;
      align-items:center;
    }
    .footer img{width:160px;background:#fff;padding:6px}
    .footer p{color:rgba(255,255,255,.74);margin-top:14px}

    @media (max-width:900px){
      .header-inner,
      .page-hero-inner,
      .article-shell,
      .footer-inner{
        grid-template-columns:1fr;
        width:min(100% - 32px,1180px);
      }
      .header-inner{align-items:flex-start;flex-direction:column;padding:18px 0;gap:8px}
      .nav{width:100%;overflow:auto}
      .nav a{padding:10px 0 16px}
      .page-title{font-size:40px}
      .page-hero{padding:48px 0 40px}
      .article-shell{gap:38px;margin-top:36px}
      .side-panel{position:relative;top:auto}
    }
  </style>
</head>
<body>
  <div class="top-rule"></div>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">
        <img src="bjzx-logo.jpg" alt="北京中学 Beijing Academy">
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="index.html#about">学校概况</a>
        <a class="active" href="index.html#news">最新动态</a>
        <a href="index.html#campus">校园文化</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="page-hero-inner">
        <div>
          <div class="breadcrumb">
            <a href="index.html">Home</a>
            <span>/</span>
            <a href="index.html#news">News</a>
            <span>/</span>
            <span id="breadcrumb-title">最新动态</span>
          </div>
          <div class="category" id="article-category">News</div>
          <h1 class="page-title" id="article-title">最新动态</h1>
        </div>
        <div class="hero-meta">
          <span>Published</span>
          <time id="article-date">2026.07</time>
          <span style="margin-top:18px;">Beijing Academy</span>
          北中观察站
        </div>
      </div>
    </section>

    <div class="article-shell">
      <article>
        <img class="lead-image" id="article-image" src="bjzx-news-1.jpg" alt="北京中学新闻配图">
        <div class="article-content" id="article-content"></div>
        <a class="back-link" href="index.html#news">返回最新动态</a>
      </article>

      <aside class="side-panel">
        <h3>Related News</h3>
        <ul class="side-list" id="related-news"></ul>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div>
        <img src="bjzx-logo.jpg" alt="北京中学 Beijing Academy">
        <p>校训：世界因我更美好</p>
      </div>
      <p>北京中学版权所有 ©2026</p>
    </div>
  </footer>

  <script>
    const articles = {
      "1":{
        title:"北京中学科技分校 2026 年“1+3”培养实验录取公告",
        date:"2026.07",
        category:"Admissions / 公告",
        image:"bjzx-news-1.jpg",
        body:`
          <p>北京中学科技分校持续推进面向未来的贯通培养实验，围绕科学素养、创新表达、综合实践与学生发展支持，构建更具连续性的成长路径。</p>
          <p>本年度项目坚持公开、公平、公正原则，结合学生综合表现与项目培养方向，完成相关录取工作。后续安排将通过学校官方渠道发布，请相关家庭保持关注。</p>
          <h2>培养方向</h2>
          <p>项目关注学生在真实问题中的学习能力，通过科学探究、跨学科项目、阅读表达和社会实践，帮助学生形成稳定的学习方法与开阔的公共视野。</p>
          <blockquote>以学生成长为中心，让每一次学习都面向真实世界。</blockquote>
          <p>学校将继续完善课程衔接、导师支持和校园资源配置，为学生提供高质量、现代化的学习环境。</p>
        `
      },
      "2":{
        title:"北京中学国际部 2026 届毕业典礼圆满礼成",
        date:"2026.06",
        category:"Campus Life / 校园生活",
        image:"bjzx-news-2.jpg",
        body:`
          <p>北京中学国际部 2026 届毕业典礼举行。师生共同回望成长历程，见证毕业生从校园走向更广阔的学习与生活舞台。</p>
          <p>典礼现场，毕业生代表分享了在北京中学的学习体验：课堂中的探究、社团中的协作、项目中的表达，都成为他们理解世界和认识自我的重要部分。</p>
          <h2>面向世界的成长</h2>
          <p>学校坚持中国根基与国际视野并重，鼓励学生在跨文化交流中建立责任感、同理心和独立判断力。</p>
          <blockquote>愿每一位毕业生带着“世界因我更美好”的信念继续出发。</blockquote>
          <p>未来，学校将继续以开放、多元、扎实的教育实践，支持学生在真实世界中成长。</p>
        `
      },
      "3":{
        title:"北京中学开展主题教育与校园实践活动",
        date:"2026.06",
        category:"Research / 教学研究",
        image:"bjzx-news-3.jpg",
        body:`
          <p>北京中学组织开展主题教育与校园实践活动，引导师生在校园空间中观察、记录、讨论与表达，形成面向真实生活的学习成果。</p>
          <p>活动围绕校园文化、公共责任、科学观察和协作表达展开，鼓励学生从日常经验出发，提出问题、收集材料、完成展示。</p>
          <h2>在真实任务中学习</h2>
          <p>学校通过项目化学习和跨学科协作，帮助学生把课堂知识连接到真实情境，让学习从“知道”走向“做到”。</p>
          <blockquote>校园不是背景，而是学生理解世界的第一现场。</blockquote>
          <p>后续，北中观察站将继续记录校园里的微小发现与持续成长。</p>
        `
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = articles[params.get("id")] ? params.get("id") : "1";
    const article = articles[id];

    document.title = `${article.title} | 北京中学`;
    document.getElementById("breadcrumb-title").textContent = article.title;
    document.getElementById("article-category").textContent = article.category;
    document.getElementById("article-title").textContent = article.title;
    document.getElementById("article-date").textContent = article.date;
    document.getElementById("article-image").src = article.image;
    document.getElementById("article-content").innerHTML = article.body;

    const related = document.getElementById("related-news");
    Object.entries(articles).forEach(([key,item])=>{
      const li = document.createElement("li");
      li.innerHTML = `<a href="news-detail.html?id=${key}">${item.title}</a>`;
      related.appendChild(li);
    });
  </script>
</body>
</html>
