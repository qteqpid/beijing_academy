<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最新动态 | 北中观察站</title>
  <style>
    :root{
      --red:#b50018;
      --red-2:#e1192d;
      --ink:#151515;
      --muted:#666;
      --line:#e7e7e7;
      --paper:#fff;
      --soft:#f6f6f6;
      --cream:#fbfaf7;
      --shadow:0 24px 70px rgba(18,24,40,.10);
      --shadow-strong:0 34px 90px rgba(18,24,40,.16);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:"Microsoft Yahei","PingFang SC",sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at 10% 16%,rgba(181,0,24,.06),transparent 24%),
        radial-gradient(circle at 84% 28%,rgba(16,120,140,.05),transparent 26%),
        var(--paper);
    }
    a{color:inherit;text-decoration:none}
    img{display:block;max-width:100%}
    .scroll-progress{
      position:fixed;
      left:0;
      top:0;
      width:0;
      height:4px;
      background:linear-gradient(90deg,var(--red),#ff3154);
      z-index:100;
      box-shadow:0 0 24px rgba(225,25,45,.45);
      pointer-events:none;
    }

    .top-rule{
      height:5px;
      background:linear-gradient(90deg,#8b0011,var(--red),#ff394f);
      position:relative;
      overflow:hidden;
    }
    .top-rule::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(110deg,transparent 0 34%,rgba(255,255,255,.22) 48%,transparent 62%);
      transform:translateX(-70%);
      animation:topSheen 7s ease-in-out infinite;
    }
    .site-header{
      background:#fff;
      border-bottom:1px solid var(--line);
      position:sticky;
      top:0;
      z-index:20;
      transition:box-shadow .28s ease;
    }
    body.is-scrolled .site-header{
      box-shadow:0 18px 46px rgba(16,24,40,.12);
    }
    .header-inner{
      width:min(1180px,calc(100% - 48px));
      min-height:86px;
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:40px;
    }
    .logo img{width:180px;height:auto}
    .logo img{transition:transform .24s ease}
    .logo:hover img{transform:translateY(-2px)}
    .nav{
      display:flex;
      gap:34px;
      color:#344054;
      font-size:16px;
      font-weight:800;
      white-space:nowrap;
    }
    .nav a{
      padding:31px 0;
      position:relative;
    }
    .nav a::after{
      content:"";
      position:absolute;
      left:0;
      bottom:24px;
      width:0;
      height:2px;
      background:var(--red);
      transition:width .24s ease;
    }
    .nav a:hover::after,
    .nav a.active::after{width:100%}

    .page-hero{
      background:
        linear-gradient(180deg,#fff 0%,var(--cream) 100%);
      border-bottom:1px solid var(--line);
      padding:76px 0 56px;
      position:relative;
      overflow:hidden;
    }
    .page-hero::before{
      content:"北京中学";
      position:absolute;
      right:-26px;
      top:6px;
      font-size:116px;
      font-weight:900;
      color:rgba(181,0,24,.055);
      letter-spacing:.02em;
    }
    .page-hero-inner{
      width:min(1180px,calc(100% - 48px));
      margin:0 auto;
      display:grid;
      grid-template-columns:minmax(0,1fr) 260px;
      gap:60px;
      align-items:end;
      position:relative;
      z-index:1;
    }
    .breadcrumb{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      color:var(--muted);
      font-size:14px;
      margin-bottom:42px;
    }
    .breadcrumb a{color:var(--red);font-weight:800}
    .category{
      color:var(--red);
      font-size:13px;
      font-weight:900;
      letter-spacing:.18em;
      text-transform:uppercase;
      margin-bottom:18px;
    }
    .page-title{
      max-width:830px;
      font-size:56px;
      line-height:1.12;
      letter-spacing:-.02em;
      font-weight:900;
      opacity:0;
      transform:translateY(22px);
      animation:riseIn .72s ease .1s forwards;
      text-wrap:balance;
    }
    .hero-meta{
      border-left:5px solid var(--red);
      padding-left:22px;
      color:#444;
      font-weight:800;
      line-height:1.9;
      opacity:0;
      transform:translateY(18px);
      animation:riseIn .72s ease .22s forwards;
    }
    .hero-meta span{
      display:block;
      color:var(--muted);
      font-size:13px;
      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .article-shell{
      width:min(1180px,calc(100% - 48px));
      margin:58px auto 96px;
      display:grid;
      grid-template-columns:minmax(0,760px) 300px;
      gap:78px;
      align-items:start;
    }
    .lead-image{
      width:100%;
      aspect-ratio:16/9;
      object-fit:cover;
      margin-bottom:44px;
      background:#ddd;
      box-shadow:22px 22px 0 var(--red),0 26px 70px rgba(18,24,40,.14);
      transition:transform .42s ease,box-shadow .42s ease,filter .42s ease;
    }
    .lead-image:hover{
      transform:translate(-6px,-6px);
      box-shadow:34px 34px 0 var(--red);
      filter:saturate(1.05) contrast(1.04);
    }
    .article-content{
      font-size:18px;
      line-height:2;
      background:#fff;
      border:1px solid var(--line);
      padding:38px 42px;
      box-shadow:0 18px 54px rgba(18,24,40,.065);
    }
    .article-content p{margin-bottom:24px}
    .article-content > *{
      opacity:0;
      transform:translateY(20px);
      transition:opacity .68s ease,transform .68s ease;
    }
    .article-content > *.in-view{
      opacity:1;
      transform:translateY(0);
    }
    .article-content h2{
      margin:48px 0 18px;
      font-size:30px;
      line-height:1.3;
      border-left:6px solid var(--red);
      padding-left:16px;
    }
    .article-content blockquote{
      margin:42px 0;
      padding:30px 34px;
      border-left:8px solid var(--red);
      background:var(--soft);
      font-size:24px;
      line-height:1.65;
      font-weight:900;
      position:relative;
      overflow:hidden;
    }
    .article-content blockquote::after{
      content:"";
      position:absolute;
      right:-40px;
      bottom:-40px;
      width:120px;
      height:120px;
      border:22px solid rgba(181,0,24,.08);
      border-radius:50%;
    }
    .side-panel{
      position:sticky;
      top:116px;
      border-top:6px solid var(--red);
      background:#fff;
      box-shadow:var(--shadow);
      padding:28px;
      transition:transform .28s ease,box-shadow .28s ease;
    }
    .side-panel:hover{
      transform:translateY(-4px);
      box-shadow:var(--shadow-strong);
    }
    .side-panel h3{
      font-size:22px;
      margin-bottom:22px;
    }
    .side-list{
      list-style:none;
      display:grid;
      gap:0;
      border-top:1px solid var(--line);
    }
    .side-list a{
      display:block;
      padding:15px 0;
      border-bottom:1px solid var(--line);
      color:#333;
      font-weight:800;
      line-height:1.5;
      transition:color .22s ease,transform .22s ease;
    }
    .side-list a:hover{
      color:var(--red);
      transform:translateX(6px);
    }
    .back-link{
      display:inline-flex;
      margin-top:28px;
      color:var(--red);
      font-weight:900;
      border-bottom:2px solid var(--red);
      padding-bottom:5px;
      transition:transform .22s ease;
    }
    .back-link:hover{transform:translateX(-6px)}
    .footer{
      background:
        linear-gradient(135deg,#111 0%,#1b1b1b 58%,#27070b 100%);
      color:#fff;
      padding:44px 0 24px;
      position:relative;
      overflow:hidden;
    }
    .footer::before{
      content:"北中观察站";
      position:absolute;
      right:-18px;
      top:0;
      font-size:88px;
      font-weight:900;
      color:rgba(255,255,255,.035);
    }
    .footer-inner{
      width:min(1180px,calc(100% - 48px));
      margin:0 auto;
      display:flex;
      justify-content:flex-start;
      gap:32px;
      align-items:center;
      position:relative;
      z-index:1;
    }
    .footer p{color:rgba(255,255,255,.74);margin-top:14px}

    @keyframes riseIn{
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
    @keyframes topSheen{
      0%,42%{transform:translateX(-80%)}
      68%,100%{transform:translateX(120%)}
    }

    @media (max-width:900px){
      .header-inner,
      .page-hero-inner,
      .article-shell,
      .footer-inner{
        grid-template-columns:1fr;
        width:min(100% - 32px,1180px);
      }
      .header-inner{align-items:flex-start;flex-direction:column;padding:18px 0;gap:8px}
      .nav{width:100%;overflow:auto}
      .nav a{padding:10px 0 16px}
      .page-title{font-size:40px}
      .page-hero{padding:48px 0 40px}
      .article-shell{gap:38px;margin-top:36px}
      .side-panel{position:relative;top:auto}
    }
  </style>
</head>
<body>
  <div class="scroll-progress" aria-hidden="true"></div>
  <div class="top-rule"></div>
  <header class="site-header">
    <div class="header-inner">
      <a class="logo" href="index.html">
        <img src="bjzx-logo.jpg" alt="北京中学 Beijing Academy">
      </a>
      <nav class="nav" aria-label="主导航">
        <a href="index.html">首页</a>
        <a href="index.html#about">学校概况</a>
        <a class="active" href="index.html#news">最新动态</a>
        <a href="index.html#campus">校园文化</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="page-hero-inner">
        <div>
          <div class="breadcrumb">
            <a href="index.html">Home</a>
            <span>/</span>
            <a href="index.html#news">News</a>
            <span>/</span>
            <span id="breadcrumb-title">最新动态</span>
          </div>
          <div class="category" id="article-category">News</div>
          <h1 class="page-title" id="article-title">最新动态</h1>
        </div>
        <div class="hero-meta">
          <span>Published</span>
          <time id="article-date">2026.07</time>
          <span style="margin-top:18px;">Beijing Academy</span>
          北中观察站
        </div>
      </div>
    </section>

    <div class="article-shell">
      <article>
        <img class="lead-image" id="article-image" src="bjzx-news-1.jpg" alt="北京中学新闻配图">
        <div class="article-content" id="article-content"></div>
        <a class="back-link" href="index.html#news">返回最新动态</a>
      </article>

      <aside class="side-panel">
        <h3>Related News</h3>
        <ul class="side-list" id="related-news"></ul>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>北中观察站 ©2026 | 学生自主研发网站 · 非官方学习展示页面</p>
    </div>
  </footer>

  <script>
    const articles = {
      "1":{
        title:"北京中学科技分校 2026 年“1+3”培养实验录取公告",
        date:"2026.07",
        category:"Admissions / 公告",
        image:"bjzx-news-1.jpg",
        body:`
          <p>北京中学科技分校持续推进面向未来的贯通培养实验，围绕科学素养、创新表达、综合实践与学生发展支持，构建更具连续性的成长路径。</p>
          <p>本年度项目坚持公开、公平、公正原则，结合学生综合表现与项目培养方向，完成相关录取工作。后续安排请以学校正式发布的信息为准。</p>
          <h2>培养方向</h2>
          <p>项目关注学生在真实问题中的学习能力，通过科学探究、跨学科项目、阅读表达和社会实践，帮助学生形成稳定的学习方法与开阔的公共视野。</p>
          <blockquote>以学生成长为中心，让每一次学习都面向真实世界。</blockquote>
          <p>学校将继续完善课程衔接、学习支持和校园资源配置，为学生提供高质量、现代化的学习环境。</p>
        `
      },
      "2":{
        title:"北京中学国际部 2026 届毕业典礼圆满礼成",
        date:"2026.06",
        category:"Campus Life / 校园生活",
        image:"bjzx-news-2.jpg",
        body:`
          <p>北京中学国际部 2026 届毕业典礼举行。师生共同回望成长历程，见证毕业生从校园走向更广阔的学习与生活舞台。</p>
          <p>典礼现场，毕业生代表分享了在北京中学的学习体验：课堂中的探究、社团中的协作、项目中的表达，都成为他们理解世界和认识自我的重要部分。</p>
          <h2>面向世界的成长</h2>
          <p>学校坚持中国根基与国际视野并重，鼓励学生在跨文化交流中建立责任感、同理心和独立判断力。</p>
          <blockquote>愿每一位毕业生带着“世界因我更美好”的信念继续出发。</blockquote>
          <p>未来，学校将继续以开放、多元、扎实的教育实践，支持学生在真实世界中成长。</p>
        `
      },
      "3":{
        title:"北京中学开展主题教育与校园实践活动",
        date:"2026.06",
        category:"Research / 教学研究",
        image:"bjzx-news-3.jpg",
        body:`
          <p>北京中学组织开展主题教育与校园实践活动，鼓励学生在校园空间中观察、记录、讨论与表达，形成面向真实生活的学习成果。</p>
          <p>活动围绕校园文化、公共责任、科学观察和协作表达展开，鼓励学生从日常经验出发，提出问题、收集材料、完成展示。</p>
          <h2>在真实任务中学习</h2>
          <p>学校通过项目化学习和跨学科协作，帮助学生把课堂知识连接到真实情境，让学习从“知道”走向“做到”。</p>
          <blockquote>校园不是背景，而是学生理解世界的第一现场。</blockquote>
          <p>后续，北中观察站将继续记录校园里的微小发现与持续成长。</p>
        `
      }
    };

    const params = new URLSearchParams(window.location.search);
    const id = articles[params.get("id")] ? params.get("id") : "1";
    const article = articles[id];

    document.title = `${article.title} | 北中观察站`;
    document.getElementById("breadcrumb-title").textContent = article.title;
    document.getElementById("article-category").textContent = article.category;
    document.getElementById("article-title").textContent = article.title;
    document.getElementById("article-date").textContent = article.date;
    document.getElementById("article-image").src = article.image;
    document.getElementById("article-content").innerHTML = article.body;

    const related = document.getElementById("related-news");
    Object.entries(articles).forEach(([key,item])=>{
      const li = document.createElement("li");
      li.innerHTML = `<a href="news-detail.html?id=${key}">${item.title}</a>`;
      related.appendChild(li);
    });

    const scrollProgress = document.querySelector(".scroll-progress");
    const updateScrollEffects = ()=>{
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const progress = maxScroll > 0 ? (window.scrollY / maxScroll) * 100 : 0;
      if (scrollProgress) scrollProgress.style.width = `${progress}%`;
      document.body.classList.toggle("is-scrolled", window.scrollY > 24);
    };
    updateScrollEffects();
    window.addEventListener("scroll", updateScrollEffects, {passive:true});

    const articleBlocks = document.querySelectorAll(".article-content > *");
    if ("IntersectionObserver" in window) {
      const observer = new IntersectionObserver((entries)=>{
        entries.forEach(entry=>{
          if (entry.isIntersecting) {
            entry.target.classList.add("in-view");
            observer.unobserve(entry.target);
          }
        });
      }, {threshold:.2});
      articleBlocks.forEach((block,index)=>{
        block.style.transitionDelay = `${Math.min(index * 70, 420)}ms`;
        observer.observe(block);
      });
    } else {
      articleBlocks.forEach(block=>block.classList.add("in-view"));
    }
  </script>
</body>
</html>
